<!doctype html>
<!--
  Uptal Recruiter - sign in.
  A real page on the public site for people who already have a dashboard.
  It never authenticates on its own: it collects the work email and the
  one-time code, hands them to Uptal_Private_Board.html#signin through the
  upb_login key, and the board performs the actual sign-in with the same
  gate logic every other entry point uses. One source of truth for auth.
-->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sign in · Uptal Recruiter</title>

    var l = "en";
    try {
      var q = new URLSearchParams(location.search).get("lang");
      var s = localStorage.getItem("uptal_pjb_lang");
      l = (q === "ar" || q === "en") ? q : (s === "ar" || s === "en") ? s : "en";
    } catch(e) {}
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";

</script>

<style>
:root{
  --ink:#061430; --ink-deep:#040D22; --persian:#353CD8; --persian-deep:#2A30AE;
  --dodger:#1E96FC; --flash:#4CEA63; --flash-ink:#06371C; --flash-tint:#E4F9EC; --flash-tag:#0B6E35;
  --tint-blue-2:#F5F7FF; --slate:#3B4A6B; --muted:#7C8496; --hair:#E4E7EF; --hair-2:#D4D9E4;
  --red-tint:#FBEAEA; --red-ink:#8E2B28;
  --on-dark-soft:#B9C2D4; --on-dark-dim:#8E9AB5; --hair-dark:rgba(255,255,255,.14);
  --font-disp:"Switzer","Inter",-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",-apple-system,"Segoe UI",sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Inter",sans-serif;
  --r-ctl:10px; --r-pill:999px;
  --sh-pop:0 24px 60px -22px rgba(6,20,48,.42);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--font-body);background:var(--ink);color:var(--on-dark-soft);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100svh;position:relative;overflow-x:clip;
}
html[lang=ar] body,html[lang=ar] button,html[lang=ar] input{font-family:var(--font-ar)}
body::before{ /* the landing's aurora, so the two pages read as one product */
  content:"";position:fixed;inset:-20% -10%;pointer-events:none;z-index:0;
  background:
    radial-gradient(42% 50% at 18% 18%,rgba(53,60,216,.5),transparent 62%),
    radial-gradient(36% 44% at 85% 12%,rgba(0,40,219,.35),transparent 60%),
    radial-gradient(30% 38% at 78% 80%,rgba(76,234,99,.14),transparent 58%);
  filter:blur(46px);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.4px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(60% 55% at 50% 38%,#000 0%,transparent 78%);
  mask-image:radial-gradient(60% 55% at 50% 38%,#000 0%,transparent 78%);
  opacity:.45;
}
h1,h2{font-family:var(--font-disp);letter-spacing:-0.02em;line-height:1.15;font-weight:800;color:var(--ink)}
html[lang=ar] h1,html[lang=ar] h2{font-family:var(--font-ar);letter-spacing:0;line-height:1.4;font-weight:700}
a{color:var(--persian);text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--dodger);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none !important}

/* topbar */
.topbar{position:relative;z-index:2}
.topbar-in{max-width:1140px;margin-inline:auto;padding:16px 22px;display:flex;align-items:center;gap:14px}
.wordmark{display:flex;align-items:center;gap:10px;color:#fff}
.wordmark .logo{height:29px;width:auto;fill:#fff;flex:none;position:relative;top:-1.5px;margin-inline-end:-11px}
.wordmark .wm-sep{width:1px;height:20px;background:var(--hair-dark);align-self:center}
.wordmark .wm-tx{font-size:16px;font-weight:600;white-space:nowrap}
.lang-pill{margin-inline-start:auto;border:1px solid var(--hair-dark);color:#fff;border-radius:var(--r-pill);
  padding:6px 14px;font-size:13px;font-weight:600;transition:background .15s}
.lang-pill:hover{background:rgba(255,255,255,.1)}

/* the card */
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:26px 22px 60px}
.card{
  width:min(440px,100%);background:#fff;border-radius:20px;box-shadow:var(--sh-pop);
  padding:34px 30px 26px;color:var(--slate);position:relative;overflow:clip;
}
.card::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:4px;
  background:linear-gradient(90deg,var(--persian),var(--flash))}
.eyebrow{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-pill);padding:4px 11px;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--flash-tint);color:var(--flash-tag);margin-block-end:14px}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:12px}
.card h1{font-size:23px;margin-block-end:6px}
.card .sub{font-size:13.5px;color:var(--muted);margin-block-end:20px}
.field{margin-block-end:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-block-end:6px;
  letter-spacing:.04em;text-transform:uppercase}
html[lang=ar] .field label{letter-spacing:0}
.in{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--hair-2);border-radius:var(--r-ctl);
  font-size:14.5px;background:#fff;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--persian);outline:none;box-shadow:0 0 0 3px rgba(53,60,216,.14)}
.in.err{border-color:#C9403C;box-shadow:0 0 0 3px rgba(201,64,60,.12)}
.err-tx{display:block;font-size:11.5px;color:var(--red-ink);margin-block-start:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border-radius:var(--r-pill);font-weight:700;font-size:15.5px;min-height:50px;padding:12px 24px;
  background:var(--persian);color:#fff;transition:background .16s,transform .16s,box-shadow .16s}
.btn:hover{background:var(--persian-deep);transform:translateY(-1px);box-shadow:0 10px 30px -6px rgba(53,60,216,.5)}
.btn[disabled]{opacity:.6;cursor:default;transform:none;box-shadow:none}
.btn .arr{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
html[dir=rtl] .btn .arr{transform:scaleX(-1)}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-block-start:14px;text-align:center}
.note a{font-weight:600}
.sent{display:flex;gap:9px;align-items:flex-start;background:var(--flash-tint);border:1px solid #BFE6CD;
  border-radius:var(--r-ctl);padding:10px 12px;font-size:12.5px;color:var(--flash-tag);margin-block-end:16px}
.sent svg{width:15px;height:15px;flex:none;margin-block-start:2px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sent b{display:block;color:var(--flash-tag)}
.warn{display:flex;gap:9px;align-items:flex-start;background:var(--red-tint);border:1px solid rgba(201,64,60,.22);
  border-radius:var(--r-ctl);padding:10px 12px;font-size:12.5px;color:var(--red-ink);margin-block-end:16px}
.warn svg{width:15px;height:15px;flex:none;margin-block-start:2px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.warn b{display:block}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-block-start:16px;padding-block-start:16px;border-top:1px solid var(--hair);font-size:13px}
.linkrow .ghost{color:var(--persian);font-weight:600;background:none}
.foot{position:relative;z-index:2;text-align:center;padding:0 22px 26px;font-size:12px;color:var(--on-dark-dim)}
.foot a{color:var(--on-dark-soft)}
@media (max-width:520px){
  .card{padding:28px 20px 22px}
  .topbar-in{padding:14px 16px}
  .wordmark .wm-tx{font-size:14px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

,37.46,15.7c9.95,10.58,15.11,23.21,15.11,37.88s-5.16,27.64-15.11,38.21Z"/></symbol>

<header class="topbar">
  <div class="topbar-in">
    <a class="wordmark" id="homeLink" href="index.html" aria-label="Uptal Recruiter">
      <svg class="logo" viewBox="0 0 1193 412" aria-hidden="true"><use href="#uptal-logo"/></svg>
      <span class="wm-sep" aria-hidden="true"></span>
      <span class="wm-tx" data-i18n="wm"></span>
    </a>
    <button class="lang-pill" id="langBtn" type="button"></button>
  </div>
</header>

<main>
  <div class="card">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 data-i18n="h"></h1>
    <p class="sub" id="sub"></p>

    <div class="warn" id="noWs" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg>
      <span><b id="noWsH"></b><span id="noWsS"></span></span>
    </div>

    <div class="sent" id="sentNote" hidden>
      <svg viewBox="0 0 24 24"><path d="m4.5 12.8 4.7 4.7L19.5 7"/></svg>
      <span><b id="sentH"></b><span id="sentS"></span></span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email" data-i18n="email_l"></label>
        <input class="in" id="email" type="email" dir="ltr" autocomplete="email" data-i18n-ph="email_ph">
        <span class="err-tx" id="emailErr" hidden></span>
      </div>
      <div class="field" id="codeField" hidden>
        <label for="code" data-i18n="code_l"></label>
        <input class="in" id="code" type="text" inputmode="numeric" maxlength="6" dir="ltr"
               autocomplete="one-time-code" data-i18n-ph="code_ph"
               style="text-align:center;letter-spacing:8px;font-size:20px;font-family:var(--font-disp)">
        <span class="err-tx" id="codeErr" hidden></span>
      </div>
      <button class="btn" id="submitBtn" type="submit">
        <span id="submitTx"></span>
        <svg class="arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="linkrow">
      <span data-i18n="new_here"></span>
      <a class="ghost" id="tryLink" href="Uptal_Private_Board.html#try" data-i18n="try_cta"></a>
    </div>
    <p class="note"><span data-i18n="help"></span> <a href="mailto:help@uptal.com">help@uptal.com</a></p>
  </div>
</main>

<p class="foot"><a id="homeLink2" href="index.html" data-i18n="back_home"></a></p>

<script>
"use strict";
function $(s){ return document.querySelector(s); }
function $all(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }

var T = {
en: {
  wm: "Recruiter",
  eyebrow: "Existing customers",
  h: "Sign in to your dashboard.",
  sub_email: "Enter your work email and we send a one-time code.",
  sub_code: "Enter the 6-digit code we sent you.",
  email_l: "Work email",
  email_ph: "you@organization.com",
  code_l: "Sign-in code",
  code_ph: "------",
  send_cta: "Send sign-in code",
  signin_cta: "Sign in",
  sent_h: "Code sent.",
  sent_s: "Prototype: any 6 digits work.",
  email_bad: "Use your work email, not a personal address.",
  code_bad: "Enter the 6-digit code.",
  nows_h: "No dashboard on that email.",
  nows_s: "Check the address, or start free and we will set one up.",
  new_here: "No account yet?",
  try_cta: "Try it free",
  help: "Trouble signing in? Write to",
  back_home: "Back to uptal.com/recruiter",
  lang_btn: "عربي",
  title: "Sign in · Uptal Recruiter"
},
ar: {
  wm: "Recruiter",
  eyebrow: "للعملاء الحاليين",
  h: "ادخل إلى لوحة تحكمك.",
  sub_email: "أدخل بريد عملك ونرسل إليك رمزاً لمرة واحدة.",
  sub_code: "أدخل الرمز المكوّن من ٦ أرقام الذي أرسلناه إليك.",
  email_l: "بريد العمل",
  email_ph: "you@organization.com",
  code_l: "رمز الدخول",
  code_ph: "------",
  send_cta: "أرسل رمز الدخول",
  signin_cta: "تسجيل الدخول",
  sent_h: "أُرسل الرمز.",
  sent_s: "نموذج تجريبي: أي ٦ أرقام تعمل.",
  email_bad: "استخدم بريد عملك لا بريداً شخصياً.",
  code_bad: "أدخل الرمز المكوّن من ٦ أرقام.",
  nows_h: "لا توجد لوحة تحكم على هذا البريد.",
  nows_s: "تحقق من العنوان، أو ابدأ مجاناً وننشئ لك واحدة.",
  new_here: "لا يوجد لديك حساب؟",
  try_cta: "جرّبها مجاناً",
  help: "تواجه صعوبة في الدخول؟ راسلنا على",
  back_home: "العودة إلى صفحة أبتال",
  lang_btn: "English",
  title: "تسجيل الدخول · أبتال ريكروتر"
}};

var LANG = document.documentElement.lang === "ar" ? "ar" : "en";
var step = "email";   /* email -> code */
function t(k){ return (T[LANG] && T[LANG][k] !== undefined) ? T[LANG][k] : (T.en[k] || k); }

function boardHref(hash){ return "Uptal_Private_Board.html" + (LANG === "ar" ? "?lang=ar" : "") + hash; }
function homeHref(){ return "index.html" + (LANG === "ar" ? "?lang=ar" : ""); }

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = t("title");
  $all("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
  $all("[data-i18n-ph]").forEach(function(el){ el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
  $("#langBtn").textContent = t("lang_btn");
  $("#langBtn").setAttribute("aria-label", LANG === "ar" ? "Switch to English" : "التبديل إلى العربية");
  $("#sub").textContent = step === "code" ? t("sub_code") : t("sub_email");
  $("#submitTx").textContent = step === "code" ? t("signin_cta") : t("send_cta");
  $("#sentH").textContent = t("sent_h");
  $("#noWsH").textContent = t("nows_h");
  $("#noWsS").textContent = t("nows_s");
  $("#sentS").textContent = t("sent_s");
  $("#tryLink").setAttribute("href", boardHref("#try"));
  $("#homeLink").setAttribute("href", homeHref());
  $("#homeLink2").setAttribute("href", homeHref());
  try { localStorage.setItem("uptal_pjb_lang", LANG); } catch(e){}
}
$("#langBtn").addEventListener("click", function(){ LANG = LANG === "ar" ? "en" : "ar"; applyLang(); });

/* the product's own rule: a work address, never a free mailbox */
var FREE_MAIL = ["gmail.com","hotmail.com","outlook.com","yahoo.com","icloud.com","live.com","aol.com","proton.me","protonmail.com","msn.com","me.com","mail.com","yandex.com","gmx.com","qq.com","163.com"];
function isWorkEmail(em){
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return false;
  var dom = em.split("@")[1].toLowerCase();
  return FREE_MAIL.indexOf(dom) < 0;
}
function showErr(field, msg){
  var input = $("#" + field), err = $("#" + field + "Err");
  input.classList.add("err"); err.textContent = msg; err.hidden = false; input.focus();
}
function clearErr(field){
  $("#" + field).classList.remove("err");
  $("#" + field + "Err").hidden = true;
}
["email","code"].forEach(function(f){
  $("#" + f).addEventListener("input", function(){ clearErr(f); });
});

$("#loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  var em = ($("#email").value || "").trim().toLowerCase();
  if (!isWorkEmail(em)){ showErr("email", t("email_bad")); return; }

  if (step === "email"){
    /* prototype: the code is simulated, exactly as the product's own gate does */
    step = "code";
    $("#codeField").hidden = false;
    $("#sentNote").hidden = false;
    applyLang();
    $("#code").focus();
    return;
  }

  var cd = ($("#code").value || "").trim();
  if (!/^\d{6}$/.test(cd)){ showErr("code", t("code_bad")); return; }

  /* hand the verified email to the product; the board runs the real sign-in
     (rehydrateWorkspaces -> enter) so auth logic lives in exactly one place */
  try { localStorage.setItem("upb_login", JSON.stringify({ email: em, at: Date.now() })); } catch(err){}
  $("#submitBtn").disabled = true;
  location.href = boardHref("#signin");
});

/* the board sends people back here when the address has no dashboard */
(function(){
  var e = null;
  try { e = new URLSearchParams(location.search).get("e"); } catch(err){}
  if (e === "nows"){
    $("#noWs").hidden = false;
    try { history.replaceState(null, "", location.pathname + (LANG === "ar" ? "?lang=ar" : "")); } catch(err){}
  }
})();

applyLang();
</script>
</body>
</html>
