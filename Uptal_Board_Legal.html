      "لأبتال تعليق لوحة التحكم أو إنهاؤها فوراً، دون إشعار ووفق تقديرها المطلق، عند مخالفة العميل شروط الخدمة أو سياسة الاستخدام المقبول، أو عند سلوك ينعكس على سجل النزاهة، أو عند تبين عدم صحة بيانات التسجيل، أو متى رأت أبتال في العميل خطراً على المرشحين أو على نزاهة اللوحة.",
      "ويوقف التعليق احتساب المدة المدفوعة. فلا تُحتسب أيام التعليق منها، وتستأنف المدة سريانها بما بقي منها عند رفع التعليق. ولا يُنشئ التعليق في ذاته أي استرداد ولا أي رصيد ولا أي تمديد يجاوز مدة الوقف نفسها. ويبقى رفع التعليق من عدمه خاضعاً لتقدير أبتال المطلق.",
      "ويسقط بالإنهاء للمخالفة كل مبلغ سُدد عن مدة لم تنقضِ. <strong>فلا يُرد منه شيء ولا يُمنح عنه رصيد</strong>، ولا يُحتسب عنه تعويض ولا بديل من أي نوع، ولا تُحتسب عنه تسوية نسبية. وإن انتهى التعليق إلى إنهاء للمخالفة سرى هذا الحكم من تاريخ الإنهاء على ما بقي من المدة. ولا يسري على هذه الحالة الاستثناء الوارد في القسم 1، فهو مقصور على إنهاء أبتال الاشتراك دون سبب يعود إلى العميل.",
      "ويبقى كل مبلغ استحق ولم يُسدد واجب الأداء بعد التعليق أو الإنهاء، ولا يُبرئ الإنهاء ذمة العميل منه."
    ]],
    ["نتيجة التوظيف", [
      "تبذل أبتال الجهد وتتيح الوصول. ولا تَعِد أبتال بأي توظيف ولا بأي عرض ولا بأي مقابلة ولا بأي عدد من المتقدمين ولا بأي نتيجة.",
      {warn: "غياب نتيجة التوظيف ليس سبباً للاسترداد. وعدم تعيين أحد، أو عدم بلوغ العدد أو المستوى المتوقع من المتقدمين، أو عدم رضا العميل عن المرشحين المعروضين عليه، لا يُنشئ أي حق في استرداد ولا في رصيد ولا في تخفيض."},
      "والعميل يشتري سعة على اللوحة لمدة محددة: شاغراً نشطاً يُنشر عليه إعلان، ومقعداً يستعمله عضو في فريقه. وتُستهلك هذه السعة بإتاحتها للعميل طوال المدة المدفوعة، سواء استعملها أو لم يستعملها.",
      "ولا يغير من ذلك أي تقدير أو توقع أو رأي أبداه أي شخص قبل الشراء أو بعده، ولا أي مادة تعريفية أو مثال توضيحي."
    ]],
    ["التوافر وتغيير المزايا", [
      "تُقدَّم الخدمة كما هي وبحسب توافرها. ولا تلتزم أبتال بنسبة توافر ولا بزمن استجابة ولا بأي مستوى أداء.",
      "وانقطاع الخدمة أو بطؤها أو تعطل أي ميزة، لأي مدة ولأي سبب، لا يُنشئ استرداداً ولا رصيداً ولا تمديداً للمدة المدفوعة ولا تخفيضاً للفاتورة التالية.",
      "ولأبتال تعديل أي ميزة أو إضافتها أو سحبها أو تغيير طريقة عملها في أي وقت ووفق تقديرها المطلق. ولا يُنشئ ذلك استرداداً ولا رصيداً، وحق العميل الوحيد هو الامتناع عن التجديد.",
      {note: "لا تصدر أبتال أرصدة خدمة من أي نوع، ولا يتضمن أي مستند من مستندات اللوحة التزاماً بمستوى خدمة."}
    ]],
    ["الاسترداد العكسي للمدفوعات", [
      "يُعد نزاع العميل على أي دفعة لدى مُصدر وسيلة الدفع أو لدى البنك، أو طلبه عكسها أو إلغاءها أو ردها، مخالفة لهذه السياسة ولشروط الخدمة.",
      "ولأبتال عندها تعليق لوحة التحكم فوراً ودون إشعار، ووقف النشر، وحجب الوصول إلى الإعلانات ومسارات المرشحين والبيانات، حتى تسوية المبلغ كاملاً.",
      "ويلتزم العميل بأداء المبلغ محل النزاع وبتعويض أبتال عن كل ما تكبدته بسببه، ومنه رسوم مُصدر وسيلة الدفع والرسوم الإدارية وتكاليف التحصيل وأتعاب المحاماة. ولأبتال مقاصة ذلك كله بأي مبلغ مستحق للعميل لديها.",
      "ولا يمنع سحب النزاع أو تسويته أبتال من إنهاء لوحة التحكم ولا من المطالبة بأي حق آخر مقرر لها."
    ]],
    ["الرصيد التقديري", [
      "لا يُلزم أي نص في هذه السياسة أبتال بمنح أي رصيد. وإن منحت أبتال رصيداً في حالة بعينها، فهو تصرف تفضلي لمرة واحدة ووفق تقديرها المطلق.",
      "والرصيد التقديري ليس استرداداً. فلا يُصرف نقداً، ولا يُحوَّل إلى غير العميل، ولا يُستعمل إلا في السعة المدفوعة على لوحة التحكم نفسها، وتنتهي صلاحيته في الموعد الذي تحدده أبتال.",
      "ولا يُنشئ منح رصيد سابقة ولا حقاً ولا توقعاً مشروعاً في منح مثله لاحقاً، ولو تكرر المنح. ولأبتال سحب أي رصيد لم يُستعمل، في أي وقت ودون إبداء الأسباب.",
      "ولا يُعد تسامح أبتال في حالة بعينها تنازلاً عن أي حكم من أحكام هذه السياسة ولا عن أي حق مقرر لها."
    ]]
  ]
};

DOCS.refund.en = {
  title: "Refund Policy",
  sub: "One rule that governs every amount paid to Uptal on the board.",
  intro: "This policy governs every amount the Customer pays to Uptal Information Technology Company for paid capacity on Uptal Recruiter. It forms an integral part of the Terms of Service and is read with them; where they conflict on a question of refund, this policy prevails. By completing any purchase on the board, the Customer accepts this policy in full through its authorized signer.",
  s: [
    ["The rule", [
      "The rule is one: <strong>there is no refund</strong>. Every amount the Customer pays to Uptal is final, and non refundable in whole and in part, in all circumstances and whatever their cause, save for the single exception stated in this section and for nothing else.",
      {warn: "All fees paid are final and non refundable, in whole and in part. No cash alternative, no credit and no pro rata adjustment is given for them, whatever the reason for the request and whenever it is made, save for the single exception stated in this section."},
      "One exception applies to this rule and one only: where Uptal ends the subscription for no cause attributable to the Customer, as the Terms of Service provide on termination without cause, the unexpired part of the paid period is refunded to the Customer pro rata by days, to the payment method used for the purchase, and after deducting every amount the Customer owes. Save for that single case, no other ground creates a right to a refund, to a credit, to a pro rata adjustment or to an extension of the paid period.",
      "Uptal is under no obligation to review any refund request, to respond to it, or to give reasons for its position. Submitting a request creates no right for the Customer, suspends no amount owed by it, and suspends no other obligation it carries."
    ]],
    ["What the rule covers", [
      "Uptal charges only two kinds of fee for the service on the board: the subscription for an additional job slot, and the subscription for an additional seat. The rule applies to every amount paid for either of them, whatever the payment method and whatever the subscription term chosen.",
      {ul: [
        "Subscription fees for additional job slots and for additional seats, for every term and on every renewal.",
        "Any part of a paid period, including where the Customer did not use the service in that part or in the period as a whole.",
        "Any paid capacity left unused, including a job slot that carried no posting, and a seat that no one occupied.",
        "Amounts paid in advance for a subscription term of three months or twelve months, including where the Customer asks to end its subscription before that term expires.",
        "Amounts paid through any payment method, including cards, wallets, SADAD and bank transfer."
      ]},
      "Value added tax charged on a fee follows that fee. So long as the fee is final and non refundable, the tax charged on it is final and non refundable too, and no credit note is issued for it except where the law requires otherwise.",
      {note: "The limitation of fees to these two kinds does not reach the agreed compensation under the non circumvention clause of the Terms of Service. That compensation is not a charge for the service and is not a payment for capacity; it is compensation for a breach. What is paid under it is final and non refundable, like every other amount paid to Uptal."}
    ]],
    ["Cancellation and non renewal", [
      "The Customer may end its subscription at any time. <strong>Ending it stops the next renewal only</strong>, and creates no refund, no credit and no adjustment for the current period.",
      "Access to paid capacity continues to the end of the paid period and then stops. Unused capacity does not carry over to a later period, to another dashboard, or to another entity, and is not converted into anything else.",
      "The timing of cancellation changes none of this. Cancelling on the day after payment and cancelling on the last day of the period have the same effect on the amounts paid."
    ]],
    ["Reducing paid capacity", [
      "The Customer may reduce the number of paid job slots or paid seats at any time, within the limits of those that are not occupied or in use.",
      "<strong>The reduction takes effect at the next renewal only</strong>, and the next invoice falls by that amount. Nothing is refunded for the current period, no credit is given for it, and no pro rata adjustment is calculated for the days remaining in it.",
      "A job slot or a seat that has been removed remains available for use until the end of the paid period. The same applies to moving from a longer subscription term to a shorter one."
    ]],
    ["Suspension and termination", [
      "Uptal may suspend or terminate a dashboard immediately, without notice and at its sole discretion, where the Customer breaches the Terms of Service or the Acceptable Use policy, where conduct is reflected in the integrity record, where registration details prove inaccurate, or where Uptal considers the Customer a risk to candidates or to the integrity of the board.",
      "Suspension pauses the paid period. The days of suspension are not counted against it, and the period resumes for the days remaining in it when the suspension is lifted. Suspension in itself creates no refund, no credit and no extension beyond the length of the pause. Whether a suspension is lifted remains at Uptal's sole discretion.",
      "Termination for breach forfeits every amount paid for a period that has not expired. <strong>Nothing is refunded from it and no credit is given for it</strong>, no compensation and no substitute of any kind is calculated for it, and no pro rata adjustment is calculated for it. Where a suspension ends in termination for breach, this paragraph applies from the date of termination to what remains of the period. The exception in section 1 does not reach this case: it is confined to a termination by Uptal for no cause attributable to the Customer.",
      "Every amount that has fallen due and remains unpaid stays payable after suspension or termination, and termination does not discharge the Customer from it."
    ]],
    ["Hiring outcome", [
      "Uptal provides effort and access. Uptal does not promise any hire, any offer, any interview, any number of applicants, or any outcome.",
      {warn: "The absence of a hiring outcome is not a ground for refund. Hiring no one, not reaching the number or the standard of applicants expected, or dissatisfaction with the candidates presented, creates no right to a refund, to a credit or to a reduction."},
      "The Customer buys capacity on the board for a defined period: a job slot that carries a posting, and a seat that a member of its team uses. That capacity is consumed by being made available to the Customer throughout the paid period, whether the Customer uses it or not.",
      "No estimate, expectation or opinion expressed by any person before or after the purchase changes this, and neither does any introductory material or illustrative example."
    ]],
    ["Availability and changes to features", [
      "The service is provided as is and as available. Uptal commits to no availability percentage, to no response time, and to no level of performance.",
      "Interruption of the service, slowness in it, or the failure of any feature, for any duration and for any reason, creates no refund, no credit, no extension of the paid period and no reduction of the next invoice.",
      "Uptal may change, add to, withdraw or alter the working of any feature at any time and at its sole discretion. This creates no refund and no credit, and the Customer's exclusive remedy is to stop renewing.",
      {note: "Uptal issues no service credits of any kind, and no document of the board contains any service level commitment."}
    ]],
    ["Chargebacks and payment reversals", [
      "A dispute raised by the Customer over any payment with the issuer of the payment method or with its bank, or a request by it to reverse, cancel or return that payment, is a breach of this policy and of the Terms of Service.",
      "Uptal may then suspend the dashboard immediately and without notice, stop publishing, and withhold access to postings, candidate pipelines and data, until the amount is settled in full.",
      "The Customer shall pay the disputed amount and shall indemnify Uptal for everything it incurs because of the dispute, including issuer fees, administrative fees, collection costs and legal fees. Uptal may set all of this off against any amount it holds for the Customer.",
      "Withdrawal or settlement of the dispute does not prevent Uptal from terminating the dashboard or from pursuing any other remedy available to it."
    ]],
    ["Discretionary credit", [
      "Nothing in this policy obliges Uptal to grant any credit. If Uptal grants a credit in a particular case, it is a one time act of grace made at its sole discretion.",
      "A discretionary credit is not a refund. It is not paid in cash, is not transferable to anyone other than the Customer, may be applied only to paid capacity on the same dashboard, and expires on the date Uptal sets for it.",
      "Granting a credit creates no precedent, no right and no legitimate expectation that a similar credit will be granted later, however often it is granted. Uptal may withdraw any unused credit at any time and without stating reasons.",
      "Forbearance by Uptal in a particular case is not a waiver of any provision of this policy or of any right it holds."
    ]]
  ]
};

DOCS.privacy.ar = {
  title: "سياسة الخصوصية",
  sub: "كيفية تعامل أبتال مع البيانات الشخصية في أبتال ريكروتر.",
  intro: "توضح هذه السياسة البيانات الشخصية التي تُجمع في أبتال ريكروتر، وأغراض معالجتها، والمسؤول عن كل مجموعة منها، والحقوق المقررة لأصحابها. وتسري على الجهة المشتركة ومستخدمي لوحة تحكمها، وعلى المرشحين المعروضين عبر اللوحة. والمرشحون ليسوا أطرافاً في الاتفاقية المبرمة بين أبتال والجهة المشتركة، ولا ينتقص أي بند في تلك الاتفاقية من حقوقهم المبينة في القسم 13. وتُعد هذه السياسة جزءاً من شروط اللوحة وتُقرأ معها، وعند التعارض في شأن البيانات الشخصية يُعمل بهذه السياسة.",
  s: [
    ["المسؤولية عن البيانات", [
      "شركة أبتال لتقنية المعلومات، الرياض، المملكة العربية السعودية، هي التي تحدد أغراض المعالجة ووسائلها في: بيانات المرشحين الشخصية المحفوظة في شبكة أبتال الموسّعة وعلى اللوحة، وتبقى أبتال هي المسؤولة عنها طوال وجودها داخل اللوحة، محجوبة كانت الهوية أم مكشوفة للجهة المشتركة؛ وبيانات الحساب والتسجيل، وبيانات التحقق من الجهة، وبيانات الفوترة، والبيانات الناتجة عن تشغيل اللوحة وتأمينها وقياس السلوك عليها. وتنفرد أبتال بهذا التحديد، ولا يتوقف على موافقة الجهة المشتركة.",
      "ولا تصير الجهة المشتركة مسؤولة مستقلة عن بيانات مرشح إلا في حدود ما تخرجه من اللوحة إخراجاً مشروعاً: ما كُشف لها على النحو المبين في القسم 5 ثم أخذته عبر السبل التي تتيحها اللوحة نفسها وفي حدود القسم 6. فمن لحظة خروج ذلك البيان إلى أنظمتها تحدد الجهة بنفسها أغراض معالجته ووسائلها وتسأل عنه وحدها، مع بقاء قصر الغرض ومدد الاحتفاظ المبينة في القسمين 6 و10 سارية عليه. وما بقي داخل اللوحة فأبتال هي المسؤولة عنه.",
      "ولا تكون أبتال معالجاً لحساب الجهة المشتركة إلا في سجلات لوحة تحكمها وحدها: الإعلانات التي تنشرها، وسجلات فريقها وصلاحياته، والقرارات التي تتخذها على المتقدمين ومبرراتها، والملاحظات التي تدونها، ونتائج التوظيف التي تسجلها. وتعالج أبتال تلك السجلات بتعليمات الجهة وفق شروط معالجة البيانات، وتبقى في الوقت نفسه مسؤولة بصفتها الأصلية عن البيانات المبينة في الفقرة الأولى.",
      "ولا تنشأ عن هذه السياسة مسؤولية مشتركة بين الطرفين. وكل طرف مسؤول وحده عن التزاماته تجاه البيانات التي يحدد أغراض معالجتها، وعن أفعال مستخدميه، ولا يتحمل أي طرف تبعة إخلال الطرف الآخر.",
      {note: "للتواصل في شؤون الخصوصية وممارسة الحقوق المبينة في هذه السياسة: help@uptal.com"}
    ]],
    ["البيانات التي تُجمع", [
      "تُجمع البيانات الآتية من الجهة المشتركة ومستخدميها مباشرة، ومن المرشحين عند انضمامهم إلى شبكة أبتال الموسّعة أو عند تقدمهم إلى إعلان، ومن تشغيل اللوحة نفسه.",
      {ul: [
        "<strong>بيانات الحساب والتسجيل</strong>: اسم الجهة ونوعها ونطاق بريدها المؤسسي وموقعها الإلكتروني، واسم المستخدم وبريد عمله ومنصبه وهاتفه وصلاحيته في لوحة التحكم، وسجلات تسجيل الدخول.",
        "<strong>بيانات التحقق</strong>: السجل التجاري أو النطاق الحكومي الرسمي، والمستندات المرفوعة لإثباته، والرقم الضريبي ورقم معروف والرقم الموحد متى قُدمت، واسم المفوَّض بالتوقيع وبريده ومنصبه وهاتفه وملفه المهني، والإشارات والنتائج المسجلة في ملف التحقق.",
        "<strong>بيانات لوحة التحكم</strong>: الإعلانات ومتطلباتها ومهل القرار، وأعضاء الفريق وصلاحياتهم، والقرارات المتخذة على المتقدمين ومبرراتها، والملاحظات، والمبادرات والإدارات والأوصاف الوظيفية المحفوظة وطلبات المقاعد، وسجل التدقيق وسجل النشاط وسجل النزاهة.",
        "<strong>بيانات المرشحين</strong>: الملف المهني والخبرة والتعليم والمهارات والراتب المتوقع والجاهزية والمدينة، والسيرة الذاتية، والاسم ووسائل التواصل، وملاحظات مكالمة التعارف، وموقف المرشح في مسار التوظيف. وتُعرض هذه البيانات على الجهة محجوبة الهوية إلى حين وقوع الفعل المبين في القسم 5.",
        "<strong>بيانات الفوترة</strong>: الباقة والشواغر النشطة والمقاعد ومدة الاشتراك والفواتير ومراجع السداد والرقم الضريبي. ولا تجمع أبتال أرقام البطاقات ولا بيانات الاعتماد البنكية ولا تخزنها؛ إذ يتولاها مزود الدفع على صفحته المؤمّنة، ولا يُحفظ لدى أبتال سوى وصف مقنّع لوسيلة الدفع.",
        "<strong>البيانات التقنية</strong>: الجهاز والمتصفح وعنوان الشبكة والموقع التقريبي المستنتج منه، وسجلات الأحداث والأمن، وبيانات الاستخدام داخل اللوحة، وما يُحفظ على جهاز المستخدم على النحو المبين في القسم 15."
      ]},
      "واللوحة ليست مستودعاً لسجلات مرشحين حصلت عليها الجهة من مصدر آخر. ولا يجوز للجهة إدخال بيانات شخصية عن أفراد لم يتقدموا إليها عبر اللوحة ولم تعرضهم أبتال عليها، وتتحمل الجهة وحدها تبعة أي إدخال من هذا القبيل."
    ]],
    ["أغراض المعالجة", [
      "تُعالج البيانات للأغراض الآتية:",
      {ul: [
        "فتح لوحة التحكم وتشغيلها وإتاحتها لمستخدميها وإدارة صلاحياتهم.",
        "التحقق من أن الجهة قائمة ومؤهلة للتسجيل، وأن المفوَّض بالتوقيع مخوّل بتمثيلها، ومن المطالبة بالنطاق المؤسسي.",
        "مطابقة المرشحين بالإعلانات، وفرز المتقدمين، وعرضهم محجوبي الهوية، وترتيب الترشيحات.",
        "إدارة مكالمة التعارف السابقة للدعوة وإعداد ملاحظاتها.",
        "تسجيل القرارات والنتائج في سجل التدقيق وسجل النشاط، وإشعار المرشحين بما يخصهم.",
        "قياس السلوك على اللوحة، وحفظ سجل النزاهة، وإنفاذ شروط اللوحة وسياسة الاستخدام المقبول.",
        "الفوترة وإصدار الفواتير والوفاء بالالتزامات الضريبية والمحاسبية وحفظ السجلات الواجب حفظها.",
        "كشف الاحتيال وإساءة الاستخدام والكشط ومحاولات استخراج بيانات التواصل والحوادث الأمنية، ومنعها والتحقيق فيها، وإدارة النزاعات والمطالبات والدفاع عنها.",
        "تشغيل الخدمة وتطويرها وتحسينها وتأمينها، وإنتاج البيانات المبينة في القسم 14."
      ]},
      "ولا تبيع أبتال البيانات الشخصية، ولا تؤجرها، ولا تتيحها لمعلنين، ولا تستخدمها في إعلان موجه يعتمد على هوية فرد."
    ]],
    ["أسس المعالجة", [
      "تقوم معالجة بيانات الجهة المشتركة ومستخدميها على تنفيذ الاتفاقية المبرمة معها وعلى ما يلزم لإبرامها وإدارتها وإنفاذها.",
      "وتقوم معالجة بيانات المرشحين على الموافقة التي يمنحها المرشح عند انضمامه إلى شبكة أبتال الموسّعة أو عند تقدمه إلى إعلان، وفي حدود الغرض الذي مُنحت له. وللمرشح سحب موافقته في أي وقت على النحو المبين في القسم 13، ويسري السحب على ما يلي تاريخه دون أثر في معالجة سابقة مشروعة.",
      "وتقوم معالجة سجلات الأمن والتدقيق والنزاهة ومنع الاحتيال على مصلحة مشروعة لأبتال في تشغيل اللوحة وحمايتها وحماية المرشحين عليها، بعد موازنتها بمصالح الأفراد وحقوقهم، وبأقل قدر من البيانات يحقق الغرض.",
      "وتقوم معالجة سجلات الفوترة والفواتير والسجلات الواجب حفظها على التزامات مفروضة على أبتال تقتضي الحفظ، ولا تخضع هذه السجلات للحذف بناءً على طلب قبل انقضاء مدتها."
    ]],
    ["حجب هوية المرشح وكشفها", [
      "تُعرض ملفات المرشحين على الجهة محجوبة الهوية. فترى الجهة جوهر الملف المهني: الخبرة والتعليم والمهارات والراتب المتوقع والجاهزية والمدينة، دون اسم المرشح ودون وسائل التواصل معه ودون ما يعرّف به أو بجهة عمله الحالية. وتبقى السيرة الذاتية الكاملة مغلقة في هذه المرحلة.",
      "وتُفتح السيرة الذاتية الكاملة عند إضافة المرشح إلى القائمة المختصرة. ولا يُكشف بهذا الفتح اسم المرشح ولا وسائل التواصل معه؛ إذ تبقى محجوبة، ويُسجَّل الفتح في سجل التدقيق.",
      "ويُكشف الاسم ووسائل التواصل عند توجيه الدعوة إلى المقابلة، وهذا هو الفعل الوحيد الذي يكشف هوية متقدم إلى إعلان الجهة. ويُبلَّغ المرشح باسم الجهة التي وجهت الدعوة إليه.",
      "ويوجد كشف واحد مأذون به قبل الدعوة: كشف ملف مرشح من شبكة أبتال الموسّعة لم يتقدم إلى الجهة. ولا يتاح هذا الكشف إلا بعد اكتمال التحقق من الجهة، وهو محدود العدد لكل وظيفة، وتُعرض آثاره قبل تنفيذه، ويُسجَّل.",
      "ولا تُتبادل الأسماء ولا بيانات التواصل في مكالمة التعارف السابقة للدعوة. وتُستخلص ملاحظات المكالمة من مجراها ومن بيانات الملف المحجوب الهوية وحدها، وتتاح للطرفين.",
      "ويُسجَّل كل كشف للبيانات في سجل التدقيق باسم المستخدم الذي نفذه وصفته وتاريخه، ويرتبط بالوظيفة والمرشح معاً. ولا ينسحب أثر الكشف على وظيفة أخرى ولا على مرشح آخر.",
      {note: "ولا تُضمَّن هويات المرشحين في أي تصدير تأخذه الجهة إلا حيث سبق أن كشفتها دعوة إلى المقابلة أو كشف ملف مأذون به. ويُصدَّر من عداهم بمسميات وظيفية دون هوية."}
    ]],
    ["التزامات الجهة تجاه بيانات المرشحين", [
      "كل بيان شخصي يخص مرشحاً ويُتاح للجهة إنما يُتاح لغرض واحد: شغل الوظيفة المحددة التي أُتيح في سياقها. وتلتزم الجهة بقصر استخدامه على ذلك الغرض وحده، وبما يأتي:",
      {ul: [
        "ألا تعيد استخدام البيانات لوظيفة أخرى، ولا لاحتياج مستقبلي، ولا لبناء مسار توظيف أو قاعدة بيانات أو قائمة مرشحين أو أي مخزون للمستقبل.",
        "ألا تنقل البيانات إلى أي طرف آخر، ومنه الشركة الأم والشركات التابعة والشقيقة والمستشارون ووكالات التوظيف ومزودو الخدمة التابعون للجهة، إلا بإذن كتابي مسبق من أبتال.",
        "ألا تنسخ البيانات ولا تصدّرها ولا تنقلها إلى أي نظام خارج اللوحة، عدا ما يلزم لشغل الوظيفة المحددة، وعبر الربط المتاح بعد التحقق وحده، وبالقيود نفسها المقررة في هذا القسم.",
        "ألا تتواصل مع المرشح خارج اللوحة قبل توجيه الدعوة إلى المقابلة، وألا تستدل على هويته بوسيلة غير الوسيلة المبينة في القسم 5.",
        "ألا تستخدم البيانات في التسويق، ولا في مقارنة الرواتب، ولا في أي تحليل أو تقرير لا يتصل بشغل الوظيفة المحددة.",
        "ألا تكشط بيانات المرشحين ولا تجمعها آلياً ولا تستخرجها استخراجاً منظماً من اللوحة بأي وسيلة.",
        "أن تحمي البيانات بضوابط لا تقل عن الضوابط المبينة في القسم 11، وأن تقصر الاطلاع عليها على من يلزمه للغرض المحدد.",
        "أن تحذف البيانات أو تتلفها عند انتهاء الغرض، وعلى الأكثر عند انقضاء المدد المبينة في القسم 10، وأن تنفذ أي طلب تحيله أبتال دون تأخير.",
        "أن تفيد أبتال فوراً بأي واقعة تمس بيانات مرشح في حوزتها، وأن تقدم ما تطلبه أبتال من إيضاحات وأدلة وسجلات خلال المدة التي تحددها."
      ]},
      {warn: "الجهة مسؤولة وحدها عن كل استخدام لبيانات المرشحين بعد إتاحتها لها، وعن كل فعل يصدر عن مستخدميها أو عن أي شخص يصل إلى لوحة تحكمها. وتعوّض الجهة أبتال تعويضاً كاملاً عن كل مطالبة أو دعوى أو غرامة أو خسارة أو تكلفة أو مصروف، ومنه أتعاب المحاماة، ينشأ عن مخالفة هذا القسم أو عن تعامل الجهة مع بيانات المرشحين. ولأبتال، عند قيام اشتباه معقول في المخالفة، أن تقيّد لوحة التحكم أو توقفها أو تنهيها فوراً ودون إشعار، وأن تطلع على السجلات المتصلة بالواقعة، وأن تبلغ من يلزم إبلاغه."},
      {note: "ولا يترتب على التقييد أو الإيقاف أو الإنهاء بموجب هذا القسم أي استرداد للرسوم ولا أي تعويض، ولا يمنع ذلك أبتال من اتخاذ أي إجراء آخر متاح لها."}
    ]],
    ["مشاركة البيانات", [
      "لا تُشارك البيانات الشخصية إلا في الحالات الآتية:",
      {ul: [
        "<strong>الجهة المشتركة</strong>: بيانات المرشحين على النحو المبين في القسم 5، وفي حدود الغرض والقيود المبينة في القسم 6.",
        "<strong>مزودو الخدمة</strong>: من يتولون لأبتال الاستضافة والتخزين والأمن وإرسال الرسائل والاتصال المدار وخدمة العملاء ومعالجة المدفوعات وتحليل الاستخدام. ويعالج كل منهم البيانات لحساب أبتال وبتعليماتها وحدها، بموجب اتفاق مكتوب يفرض عليه التزامات لا تقل عن الالتزامات المقررة هنا.",
        "<strong>الجهات المختصة</strong>: متى طُلبت البيانات بموجب إجراء صحيح، أو لزم الإفصاح لحماية حق أو لدرء ضرر أو لمباشرة مطالبة أو للدفاع عنها.",
        "<strong>الصفقات المؤسسية</strong>: في سياق اندماج أو استحواذ أو نقل أعمال أو إعادة هيكلة، تنتقل البيانات إلى الخلف بالضمانات نفسها المقررة في هذه السياسة.",
        "<strong>ضم النطاق المؤسسي</strong>: على النحو المبين في القسم 8."
      ]},
      "وتختار أبتال مزودي خدماتها وتستبدلهم بمحض تقديرها، ولا يتوقف أي تغيير في هذه الفئات على موافقة الجهة المشتركة ولا على إشعارها المسبق. وتبقى أبتال مسؤولة تجاه الأفراد عن معالجة من يعمل لحسابها."
    ]],
    ["ضم النطاق المؤسسي", [
      "عند اكتمال التحقق من جهة، تطالب أبتال بنطاق بريدها المؤسسي باسم تلك الجهة. وتُضم عندئذ كل لوحة تحكم أخرى مسجلة على النطاق نفسه إلى لوحة التحكم المتحقَّق منها، وتزول صفتها حساباً مستقلاً.",
      {warn: "الضم ينقل بيانات شخصية تخص مرشحين بين حسابات مسجلة على النطاق المؤسسي نفسه. فتنتقل إلى لوحة التحكم المتحقَّق منها الإعلانات ومسارات المرشحين والقرارات والملاحظات ونتائج التوظيف والمبادرات والأوصاف الوظيفية المحفوظة والإدارات وطلبات المقاعد وسجل النزاهة. ومن تاريخ الضم تكون الجهة المتحقَّق منها هي المسؤولة عن تلك السجلات، ويطلع مسؤول حسابها على ما تتضمنه من بيانات مرشحين، ومنها هويات سبق كشفها على اللوحة المضمومة."},
      "ويصبح المفوَّض بالتوقيع الذي أتم التحقق مسؤول الحساب على لوحة التحكم المتحقَّق منها. ويلتحق مسؤولو اللوحات المضمومة بصفة أخصائي توظيف، وكل تغيير لاحق في الصلاحيات يعود إلى مسؤول الحساب وحده. ويصل المستخدم إلى لوحة التحكم المتحقَّق منها ببيانات دخوله السابقة نفسها.",
      "ولا تُضم إلا لوحات التحكم المسجلة على نطاق أكدته الجهة بوصفه نطاقها، ولا يُعاد تخصيص نطاق سبقت المطالبة به. ومن تحقق لاحقاً على نطاق مطالَب به انضمت لوحة تحكمه إلى صاحب المطالبة. وتبقى بيانات المرشحين المنقولة خاضعة لقصر الغرض نفسه ولمدد الاحتفاظ نفسها التي كانت تسري عليها قبل الضم، ولا يوسّع الضم أي إذن ولا ينشئ غرضاً جديداً.",
      {note: "وعلى كل جهة تسجل لوحة تحكم على نطاق بريد مؤسسي أن تعدّ سجلات تلك اللوحة قابلة للانتقال إلى الجهة التي تتحقق على ذلك النطاق. ومن لم يرد انتقال سجلاته فسبيله ألا يسجل على نطاق جهة أخرى."}
    ]],
    ["موقع الحفظ والنقل", [
      "تُعالج بيانات لوحة التحكم وبيانات المرشحين وتُخزن داخل المملكة العربية السعودية.",
      "ولا يقع نقل هذه البيانات أو إتاحتها خارج المملكة إلا في الحدود التي تجيزها الأنظمة، وبعد اتخاذ الضمانات التي تشترطها، وبما يحفظ لها مستوى الحماية المقرر داخل المملكة. ويقتصر ما ينقل على القدر اللازم للغرض، ويكون لمدة لا تتجاوز حاجته.",
      "على أن إيصال الواجهة إلى متصفح المستخدم يستعين ببنية تقنية معتادة ليست كلها داخل المملكة. فتُطلب بعض عناصر العرض، كالخطوط وملفات التنسيق، من شبكات توزيع محتوى خارجية، ويحمل الطلب عندئذ ما يحمله أي طلب شبكة: عنوان الشبكة ونوع الجهاز والمتصفح. ولا تُرسل في هذه الطلبات بيانات مرشحين ولا سجلات لوحة تحكم ولا بيانات حساب. وتعمل أبتال على نقل هذه العناصر إلى استضافتها داخل المملكة، ولا تُقرأ الفقرة الأولى من هذا القسم على أنها تشمل هذه العناصر.",
      {note: "ولأبتال تغيير مزودي الاستضافة ومواقع التشغيل بمحض تقديرها، على أن يبقى الالتزام المبين في الفقرة الأولى من هذا القسم قائماً في كل الأحوال."}
    ]],
    ["مدد الاحتفاظ والحذف", [
      "تُمحى تفاصيل المرشحين المرتبطة بإعلان بعد 60 يوماً من نشره. وبانقضاء هذه المدة لا تبقى لدى الجهة تفاصيل معرِّفة عن متقدمين لم توجَّه إليهم دعوة إلى المقابلة. ولا يجوز للجهة أن تحتفظ خارج اللوحة بما مُحي داخلها.",
      {ul: [
        "<strong>سجلات الحساب والتحقق</strong>: تُحفظ طوال سريان الاشتراك، ثم للمدة اللازمة لإثبات التحقق وللدفاع عن المطالبات.",
        "<strong>سجلات الفوترة والفواتير</strong>: تُحفظ للمدة التي تقتضيها المتطلبات التجارية والضريبية والمحاسبية.",
        "<strong>سجل التدقيق وسجل النشاط وسجل النزاهة</strong>: تُحفظ بوصفها سجلاً لأفعال وقعت، وتبقى بعد انتهاء الاشتراك وبعد محو الإعلان الذي تتصل به، للمدة اللازمة للإنفاذ وتسوية النزاعات وإثبات سلامة التشغيل.",
        "<strong>ملف المرشح في شبكة أبتال الموسّعة</strong>: يُحفظ ما دامت موافقة المرشح قائمة، ويُحذف أو يُجرَّد من عناصر التعريف عند سحبها أو عند انتفاء الحاجة إليه.",
        "<strong>سجلات الأمن</strong>: تُحفظ للمدة اللازمة لكشف الحوادث والتحقيق فيها ومنع تكرارها."
      ]},
      "وعند إغلاق لوحة التحكم تُنهى الإعلانات المنشورة فوراً، ويُشعر المرشحون قيد النظر، وتُلغى صلاحية دخول الفريق، ويُحدد موعد حذف بيانات لوحة التحكم بعد انقضاء مدد الاحتفاظ. وللجهة تصدير بيانات لوحة تحكمها قبل الإغلاق، وهذا التصدير متاح دون اشتراط التحقق ودون مقابل، وكذلك تنزيل الفواتير.",
      "وتُحذف البيانات أو تُجرَّد من عناصر التعريف بانقضاء المدة المقررة لها. وتبقى البيانات المجرّدة والمجمّعة محفوظة دون حد زمني على النحو المبين في القسم 14."
    ]],
    ["الأمن وسجلات الأفعال", [
      "تطبق أبتال التشفير أثناء النقل وفي التخزين، وضوابط وصول قائمة على الصلاحيات، ومبدأ أقل الصلاحيات للاطلاع الداخلي، وفصل بيئات التشغيل، ومراقبة مستمرة للأحداث الأمنية.",
      "ويُسجَّل كل فعل على اللوحة في سجل تدقيق باسم من نفذه وصفته وتاريخه، ويشمل ذلك فتح الملفات المحجوبة الهوية وفتح السيرة الذاتية وكشف البيانات والقرارات والتصديرات وتغيير الصلاحيات. ولأبتال الاطلاع على هذه السجلات واستخدامها في الإنفاذ والتحقيق وتسوية النزاعات ومباشرة المطالبات والدفاع عنها، دون إشعار مسبق.",
      "والجهة المشتركة مسؤولة عن حماية الوصول إلى لوحة تحكمها: حفظ بيانات الدخول، وقصر الدعوات على عناوين نطاقها المؤسسي، وسحب صلاحية من انتهت علاقته بها، وإفادة أبتال فور الاشتباه في وصول غير مصرح به.",
      "ولا يمكن ضمان أمن أي نظام ضماناً مطلقاً. وتبذل أبتال العناية المبينة في هذا القسم، ولا تقدم أي ضمان يزيد عليها، ولا تتحمل تبعة واقعة مصدرها بيئة الجهة أو أجهزة مستخدميها أو بيانات دخولهم."
    ]],
    ["المعالجة الآلية", [
      "المطابقة والفرز معالجة آلية. فيقارن محرك المطابقة متطلبات الإعلان ببيانات ملفات المرشحين، ويرتّب الترشيحات، ويحجب هوية من يُعرض، ويحدد من يُعرض على الجهة ومن لا يُعرض، دون مراجعة بشرية لكل حالة على حدة.",
      "وتُنتَج ملاحظات مكالمة التعارف آلياً من مجرى المكالمة ومن بيانات الملف المحجوب الهوية، وتتاح للطرفين، ولا تتضمن أسماء ولا بيانات تواصل.",
      "ويتضمن التحقق من الجهة تقييماً آلياً لإشارات مستمدة من البيانات والمستندات المقدمة، ينتج عنه ترشيح قرار. والقرار في التحقق يصدر عن أبتال، ولها اعتماد الترشيح أو مخالفته بمحض تقديرها، ولها طلب بيانات إضافية أو إعادة التحقق في أي وقت.",
      "ويُحسب سجل النزاهة آلياً من الأفعال المسجلة على لوحة التحكم، وقد يترتب عليه تقييد النشر أو إيقافه. وهذا القياس يخص الجهة ولوحة تحكمها، لا الأفراد العاملين فيها.",
      "ولكل شخص خضع لمعالجة آلية ترتب عليها أثر نظامي في حقه أو أثر جوهري مماثل أن يطلب مراجعة بشرية لها، وأن يبدي وجهة نظره، وأن يعترض على النتيجة، على النحو المبين في القسم 13. وتُجرى المراجعة من مخوّل لم يشارك في إصدار النتيجة، ويُبلَّغ مقدم الطلب بنتيجتها."
    ]],
    ["حقوق أصحاب البيانات", [
      "لكل شخص تُعالج بياناته الشخصية على اللوحة الحقوق الآتية، ويمارسها دون مقابل:",
      {ul: [
        "<strong>العلم</strong>: معرفة أساس معالجة بياناته والغرض منها ومن تُتاح له.",
        "<strong>الاطلاع</strong>: الحصول على بياناته المحفوظة لدى أبتال، والحصول على نسخة منها بصيغة مقروءة وواضحة.",
        "<strong>التصحيح</strong>: تصحيح بياناته أو تحديثها أو إكمالها.",
        "<strong>الإتلاف</strong>: إتلاف بياناته متى انتفت الحاجة إليها للغرض الذي جُمعت من أجله.",
        "<strong>سحب الموافقة</strong>: سحب الموافقة في أي وقت متى قامت المعالجة عليها، ويسري السحب على ما يلي تاريخه.",
        "<strong>الاعتراض والمراجعة</strong>: الاعتراض على نتيجة معالجة آلية ترتب أثراً في حقه، وطلب مراجعتها بشرياً.",
        "<strong>الشكوى</strong>: رفع شكوى إلى الجهة الرقابية المختصة في المملكة، دون توقف ذلك على الرجوع إلى أبتال أولاً."
      ]},
      "وتُقدَّم الطلبات إلى help@uptal.com. ويُسجَّل كل طلب عند وصوله، ويُرد عليه خلال المدة المقررة. ولأبتال التحقق من هوية مقدم الطلب قبل تنفيذه، بالقدر اللازم للتحقق لا أكثر، ولا تُستخدم البيانات المقدمة للتحقق في غير هذا الغرض.",
      "ولا يُرفض طلب إلا حيث تجيز الأنظمة ذلك، ومنه ما يلزم الاحتفاظ به لغرض رقابي أو محاسبي، أو ما يمس حقوق غيره، أو ما يتصل بمطالبة قائمة. ويُبيَّن سبب الرفض لمقدم الطلب مع سبيل الاعتراض عليه.",
      "وحيث يتعلق الطلب ببيانات محفوظة في سجلات لوحة تحكم جهة مشتركة، تحيله أبتال إليها وتتابع تنفيذه. وتلتزم الجهة بتنفيذ ما يُحال إليها دون تأخير وإفادة أبتال بما تم، ويُعد التخلف عن ذلك مخالفة لشروط اللوحة.",
      {note: "ولا ينتقص أي بند في الاتفاقية المبرمة بين أبتال والجهة المشتركة من هذه الحقوق، ولا يملك أي منهما التنازل عنها نيابة عن أصحابها. وممارسة هذه الحقوق لا تُتخذ سبباً لأي معاملة أقل ولا لأي أثر في فرص صاحبها على اللوحة."}
    ]],
    ["البيانات المجمّعة ومجهولة الهوية", [
      "لأبتال أن تنتج من كل نشاط يقع على اللوحة بيانات مجمّعة ومجهولة الهوية ومجردة من عناصر التعريف، وبيانات إحصائية ومؤشرات ومشتقات ونماذج مبنية عليها.",
      "ولأبتال استخدام هذه البيانات والمشتقات استخداماً غير مقيد، على سبيل الدوام ودون حد زمني ولا حد جغرافي، ولأي غرض تراه، ومنه تشغيل الخدمة وتطويرها وتحسينها وتأمينها وتدريب أنظمتها، وإنتاج مؤشرات سوق العمل ونشرها، والتسويق والعرض التجاري. وهذه البيانات والمشتقات ملك خالص لأبتال، ولا تنشأ للجهة المشتركة ولا لغيرها أي حقوق عليها.",
      "ولا يستحق أحد مقابلاً عن هذا الاستخدام، ولا يتاح للجهة المشتركة الاعتراض عليه ولا الخروج منه ولا تقييده، ويبقى قائماً بعد انتهاء الاشتراك وبعد إغلاق لوحة التحكم وبعد حذف السجلات التي اشتُق منها.",
      "ويشترط في هذه البيانات ألا تعرّف بأي فرد ولا بأي جهة، وألا تتيح التعرف عليهما بضمها إلى بيانات أخرى بوسائل معقولة. ولا تُعاد إليها عناصر التعريف، ولا تُستخدم في محاولة التعرف على فرد بعينه.",
      {note: "وما دامت البيانات على هذه الصفة فهي ليست بيانات شخصية، ولا تسري عليها الحقوق المبينة في القسم 13؛ إذ لا سبيل إلى ربطها بصاحبها."}
    ]],
    ["ملفات الارتباط والتخزين على الجهاز وقياس الاستخدام", [
      "تحفظ اللوحة على جهاز المستخدم مفاتيح في التخزين المحلي للمتصفح وفي تخزين الجلسة. وهي المفاتيح التي تبدأ بالسابقة upb_ ومفتاح اللغة uptal_pjb_lang، وتُحفظ على الجهاز نفسه لا على خادم إعلاني. وهذا ما تحفظه ولماذا:",
      {ul: [
        "<strong>الجلسة</strong>: إبقاء المستخدم داخل لوحة تحكمه بعد تسجيل الدخول، وربط الجلسة بلوحة التحكم الصحيحة.",
        "<strong>اللغة</strong>: حفظ اللغة المختارة، عربية أو إنجليزية، واتجاه العرض المناسب لها.",
        "<strong>موضع العمل</strong>: الشاشة المفتوحة والتبويب المفتوح والوظيفة أو المبادرة قيد العرض، حتى يعود المستخدم إلى حيث كان.",
        "<strong>المسودات وخيارات الواجهة</strong>: ما لم يُرسل بعد من نماذج، وترتيب العرض والتفضيلات الظاهرة.",
        "<strong>نسخ عاملة من سجلات لوحة التحكم</strong>: تُحفظ على الجهاز لتسريع العرض، ولا تغني عن السجل المحفوظ لدى أبتال ولا تقوم مقامه."
      ]},
      "ولا تضع اللوحة ملفات ارتباط إعلانية، ولا تستعين بشبكات إعلان، ولا بأدوات تتبع تتعقب المستخدم عبر مواقع أخرى، ولا يحمل ما يُحفظ على الجهاز معرّفاً إعلانياً. ولهذا لا تعرض اللوحة نافذة موافقة على ملفات الارتباط؛ فما يُحفظ لازم لتشغيل لوحة التحكم ولحفظ تفضيلات مستخدمها.",
      "ويقع قياس الاستخدام داخل اللوحة نفسها، من الأحداث والسجلات المبينة في القسمين 2 و11، ولحساب أبتال وحدها وبتعليماتها على النحو المبين في القسم 7. ولا تُتاح هذه القياسات لمعلنين، ولا تُستخدم في بناء ملف إعلاني عن أي شخص.",
      "وللمستخدم في أي وقت حذف ما حُفظ على جهازه من إعدادات المتصفح الخاصة بهذا الموقع، أو منع حفظه ابتداءً. ويترتب على الحذف الخروج من الجلسة، وعودة اللغة وخيارات الواجهة إلى حالتها الأولى، وفقدان ما لم يُرسل من مسودات. ولا يمس الحذف السجلات المحفوظة لدى أبتال، ولا يُعد طلب حذف بالمعنى المبين في القسم 13، وسبيل ذلك ما نص عليه ذلك القسم.",
      {note: "وإذا منع المستخدم التخزين المحلي في متصفحه فقد تتعذر إتاحة لوحة التحكم أو يفقد موضع عمله عند كل تحديث للصفحة. وهذا أثر تقني لا عقوبة، ولا يمس أي حق من الحقوق المبينة في القسم 13."}
    ]],
    ["تعديل هذه السياسة", [
      "لأبتال تعديل هذه السياسة في أي وقت وبمحض تقديرها. وتُنشر النسخة السارية على لوحة التحكم وعلى صفحة الشؤون النظامية، ويحمل كل إصدار تاريخ سريانه.",
      "ويسري التعديل من تاريخ نشره أو من تاريخ أول دخول للجهة المشتركة بعده، أيهما أبعد. ويُعد استمرار الجهة المشتركة في استخدام اللوحة بعد ذلك قبولاً للنسخة المعدّلة. ومن لم يقبلها فسبيله إنهاء الاشتراك وفق شروط اللوحة، دون أن يترتب على الإنهاء استرداد.",
      "وحيث يمس التعديل معالجة قائمة على موافقة مرشح، تُطلب موافقة جديدة قبل العمل به في حقه، ولا يُستدل على الموافقة من مجرد استمرار وجود الملف.",
      {note: "للاستفسار عن هذه السياسة أو لممارسة أي حق مبين فيها: help@uptal.com"}
    ]]
  ]
};

DOCS.privacy.en = {
  title: "Privacy Policy",
  sub: "How Uptal handles personal data in Uptal Recruiter.",
  intro: "This policy explains what personal data is collected in Uptal Recruiter, why it is processed, who is responsible for each set of it, and the rights available to the people it concerns. It applies to the subscribing entity and to its dashboard users, and to candidates presented through the board. Candidates are not parties to the agreement between Uptal and the subscribing entity, and no term of that agreement reduces the rights set out in section 13. This policy forms part of the board terms and is read with them, and where the two differ on a matter of personal data this policy prevails.",
  s: [
    ["Responsibility for the data", [
      "Uptal Information Technology Company, Riyadh, Kingdom of Saudi Arabia, determines the purposes and the means of processing for: candidate personal data held in the wider Uptal network and on the board, which stays Uptal's responsibility at all times while it is inside the board, whether the identity is sealed or has been opened to the subscribing entity; account and registration data; entity verification data; billing data; and the data generated by operating the board, securing it and measuring conduct on it. Uptal makes that determination alone, and it does not depend on the subscribing entity's agreement.",
      "The subscribing entity becomes an independent controller of candidate personal data only in respect of what it lawfully takes out of the board: data opened to it as set out in section 5 and then taken through the routes the board itself provides, within the limits of section 6. From the moment that data leaves the board for the entity's own systems, the entity determines the purposes and the means of processing it and answers for it alone, while the purpose limitation and the retention periods set out in sections 6 and 10 continue to apply to it. What remains inside the board remains Uptal's responsibility.",
      "Uptal is a processor for the subscribing entity only in respect of the records of the entity's own dashboard: the postings it publishes, its team records and their permissions, the decisions it takes on applicants and the reasons for them, the notes it writes, and the hiring outcomes it records. Uptal processes those records on the entity's instructions under the Data Processing Terms, and at the same time remains responsible in its own right for the data set out in the first paragraph.",
      "This policy creates no joint responsibility between the two parties. Each party alone answers for its obligations toward the data whose purposes it determines, and for the acts of its own users, and neither party bears the consequences of the other's breach.",
      {note: "For privacy matters and to exercise the rights set out in this policy: help@uptal.com"}
    ]],
    ["The data collected", [
      "The data below is collected from the subscribing entity and its users directly, from candidates when they join the wider Uptal network or apply to a posting, and from the operation of the board itself.",
      {ul: [
        "<strong>Account and registration data</strong>: the entity's name and type, its corporate email domain and website, and each user's name, work email, job title, phone and dashboard permission, together with sign-in records.",
        "<strong>Verification data</strong>: the commercial registration or the official government domain, the documents uploaded to prove it, the VAT number, the Maroof number and the unified number where provided, the authorized signer's name, email, job title, phone and professional profile, and the signals and results recorded in the verification file.",
        "<strong>Dashboard data</strong>: postings and their requirements and decision windows, team members and their permissions, the decisions taken on applicants and the reasons for them, notes, initiatives, departments, saved job descriptions and seat requests, and the audit log, the activity ledger and the integrity record.",
        "<strong>Candidate data</strong>: professional profile, experience, education, skills, expected salary, availability and city, the curriculum vitae, the name and contact details, the notes of the intro call, and the candidate's position in the hiring pipeline. This data is presented to the entity with identity sealed until the act set out in section 5 occurs.",
        "<strong>Billing data</strong>: plan, active job slots, seats, subscription term, invoices, payment references and the VAT number. Uptal neither collects nor stores card numbers or banking credentials; the payment provider handles them on its own secured page, and Uptal holds no more than a masked description of the payment method.",
        "<strong>Technical data</strong>: device, browser, network address and the approximate location derived from it, event and security logs, usage data inside the board, and what is kept on the user's own device as set out in section 15."
      ]},
      "The board is not a repository for candidate records the entity obtained elsewhere. The entity may not enter personal data about individuals who did not apply to it through the board and were not presented to it by Uptal, and the entity alone bears the consequences of any such entry."
    ]],
    ["Why the data is processed", [
      "The data is processed for the following purposes:",
      {ul: [
        "To open, operate and make the dashboard available to its users and to manage their permissions.",
        "To verify that the entity exists and is eligible to register, that the authorized signer holds authority to represent it, and to establish the claim over the corporate domain.",
        "To match candidates to postings, to screen applicants, to present them with identity sealed, and to order the submissions.",
        "To run the sealed intro call that precedes an invitation and to produce its notes.",
        "To record decisions and outcomes in the audit log and the activity ledger, and to notify candidates of what concerns them.",
        "To measure conduct on the board, to maintain the integrity record, and to enforce the board terms and the acceptable use policy.",
        "To bill, to issue invoices, to meet tax and accounting obligations, and to keep the records that must be kept.",
        "To detect, prevent and investigate fraud, misuse, scraping, attempts to extract contact details and security incidents, and to handle, pursue and defend disputes and claims.",
        "To operate, develop, improve and secure the service, and to produce the data described in section 14."
      ]},
      "Uptal does not sell personal data, does not rent it, does not make it available to advertisers, and does not use it for targeted advertising that rests on an individual's identity."
    ]],
    ["The basis for processing", [
      "Processing of the subscribing entity's data and that of its users rests on performance of the agreement with it and on what is needed to conclude, administer and enforce that agreement.",
      "Processing of candidate data rests on the consent the candidate gives when joining the wider Uptal network or when applying to a posting, and within the purpose for which it was given. A candidate may withdraw consent at any time as set out in section 13; withdrawal takes effect from that date and does not affect lawful processing that came before it.",
      "Processing of security, audit, integrity and fraud prevention records rests on a legitimate interest of Uptal in operating and protecting the board and in protecting the candidates on it, weighed against the interests and rights of individuals, and carried out with the least data that achieves the purpose.",
      "Processing of billing records, invoices and records that must be kept rests on obligations imposed on Uptal that require their retention, and those records are not subject to deletion on request before their period ends."
    ]],
    ["Sealed candidate identity, and how it opens", [
      "Candidate profiles are presented to the entity with identity sealed. The entity sees the professional substance of the profile: experience, education, skills, expected salary, availability and city, without the candidate's name, without contact details, and without anything that identifies the candidate or the candidate's current employer. The full curriculum vitae stays closed at that stage.",
      "The full curriculum vitae opens when the entity shortlists the candidate. That opening reveals neither the name nor the contact details, which stay sealed, and it is recorded in the audit log.",
      "The name and the contact details open when an interview invitation is issued, and that is the single act that reveals the identity of an applicant to the entity's posting. The candidate is told the name of the entity that issued the invitation.",
      "One reveal is sanctioned before an invitation: unlocking the profile of a candidate in the wider Uptal network who did not apply to the entity. That unlock is available only once verification of the entity is complete, it is limited in number per role, its consequences are shown before it is spent, and it is recorded.",
      "No names and no contact details are exchanged on the sealed intro call that precedes an invitation. The notes of that call are produced from the course of the call and from sealed profile data alone, and they are available to both parties.",
      "Every reveal of data is recorded in the audit log with the name and role of the user who performed it and the date, and it is tied to the role and the candidate together. The effect of a reveal does not carry to another role or to another candidate.",
      {note: "Candidate identities are included in an export the entity takes only where an interview invitation or a sanctioned profile unlock had already opened them. Everyone else is exported under a job label with no identity."}
    ]],
    ["The Customer's obligations toward candidate data", [
      "Every item of personal data about a candidate that is made available to the entity is made available for one purpose: filling the specific vacancy in whose context it was made available. The entity shall confine its use to that purpose alone, and shall observe the following:",
      {ul: [
        "Not to reuse the data for another vacancy, for a future need, or to build a pipeline, a database, a candidate list or any store for later use.",
        "Not to transfer the data to any other party, including a parent company, subsidiaries, affiliates, advisers, recruitment agencies and the entity's own service providers, except with Uptal's prior written permission.",
        "Not to copy, export or move the data to any system outside the board, other than what is necessary to fill the specific vacancy, through the integration that opens after verification alone, and under the same restrictions set out in this section.",
        "Not to contact the candidate outside the board before an interview invitation has been issued, and not to work out the candidate's identity by any route other than the one set out in section 5.",
        "Not to use the data for marketing, for salary benchmarking, or for any analysis or report unconnected with filling the specific vacancy.",
        "Not to scrape candidate data, collect it by automated means, or extract it from the board in any systematic way.",
        "To protect the data with controls no weaker than those set out in section 11, and to confine access to those who need it for the specific purpose.",
        "To delete or destroy the data when the purpose ends, and at the latest when the periods set out in section 10 expire, and to carry out without delay any request Uptal refers to it.",
        "To inform Uptal immediately of any incident affecting candidate data in its hands, and to supply the explanations, evidence and records Uptal asks for within the period Uptal sets."
      ]},
      {warn: "The entity alone is responsible for every use of candidate data after it is made available to it, and for every act of its users or of any person reaching its dashboard. The entity shall indemnify Uptal in full against every claim, action, fine, loss, cost and expense, including legal fees, arising from a breach of this section or from the entity's handling of candidate data. Where Uptal holds a reasonable suspicion of a breach, Uptal may restrict, suspend or terminate the dashboard immediately and without notice, may examine the records connected with the incident, and may inform whoever must be informed."},
      {note: "A restriction, suspension or termination under this section gives rise to no refund of fees and no compensation, and does not prevent Uptal from taking any other step available to it."}
    ]],
    ["Sharing", [
      "Personal data is shared only in the following cases:",
      {ul: [
        "<strong>The subscribing entity</strong>: candidate data as set out in section 5, and within the purpose and the restrictions set out in section 6.",
        "<strong>Service providers</strong>: those who carry out hosting, storage, security, message delivery, managed calling, customer support, payment processing and usage analysis for Uptal. Each of them processes the data on Uptal's behalf and on its instructions alone, under a written agreement imposing obligations no weaker than those set out here.",
        "<strong>Competent authorities</strong>: where the data is sought under a valid process, or disclosure is needed to protect a right, to prevent harm, or to bring or defend a claim.",
        "<strong>Corporate transactions</strong>: in a merger, an acquisition, a transfer of business or a restructuring, the data passes to the successor under the same safeguards set out in this policy.",
        "<strong>Corporate domain consolidation</strong>: as set out in section 8."
      ]},
      "Uptal selects and replaces its service providers at its sole discretion, and no change within these categories depends on the subscribing entity's agreement or on prior notice to it. Uptal remains answerable to individuals for the processing carried out by those acting on its behalf."
    ]],
    ["Corporate domain consolidation", [
      "When verification of an entity is complete, Uptal claims that entity's corporate email domain in its name. Every other dashboard registered on the same domain is then consolidated into the verified dashboard and ceases to exist as a separate account.",
      {warn: "Consolidation moves personal data about candidates between accounts registered on the same corporate domain. Postings, candidate pipelines, decisions, notes, hiring outcomes, initiatives, saved job descriptions, departments, seat requests and the integrity record pass to the verified dashboard. From the date of consolidation the verified entity is the one responsible for those records, and its administrator can see the candidate data they contain, including identities that had already been revealed on the consolidated dashboard."},
      "The authorized signer who completed verification becomes the administrator of the verified dashboard. Administrators of the consolidated dashboards arrive as Recruiters, and every later change of permission rests with the administrator alone. A user reaches the verified dashboard with the same sign-in details as before.",
      "Only dashboards registered on a domain the entity has confirmed as its own are consolidated, and a domain already claimed is not reassigned. An entity that verifies later on a claimed domain has its dashboard joined to the holder of the claim. Candidate data carried across stays subject to the same purpose limitation and the same retention periods that applied to it before consolidation, and consolidation widens no permission and creates no new purpose.",
      {note: "An entity that registers a dashboard on a corporate email domain should treat the records of that dashboard as liable to pass to the entity that verifies on that domain. A party that does not want its records to pass should not register on another entity's domain."}
    ]],
    ["Where the data is held, and transfers", [
      "Dashboard data and candidate data are processed and stored within the Kingdom of Saudi Arabia.",
      "No transfer of that data or access to it outside the Kingdom takes place except to the extent the law permits, after the safeguards it requires are in place, and in a way that preserves the level of protection the data has inside the Kingdom. What is transferred is confined to what the purpose requires, and for no longer than that purpose needs.",
      "Delivering the interface to a user's browser does rely on ordinary technical infrastructure that is not wholly inside the Kingdom. Some presentation elements, such as fonts and style files, are requested from external content delivery networks, and such a request carries what any network request carries: the network address, the device type and the browser. No candidate data, no dashboard record and no account data is sent in those requests. Uptal is working to move these elements into its own hosting inside the Kingdom, and the first paragraph of this section is not to be read as covering them.",
      {note: "Uptal may change its hosting providers and its operating locations at its sole discretion, provided the obligation set out in the first paragraph of this section remains in force in every case."}
    ]],
    ["Retention and deletion", [
      "Candidate details attached to a posting clear 60 days after it is published. Once that period ends, the entity holds no identifying details about applicants it did not take as far as an interview invitation. The entity may not keep outside the board what has been cleared inside it.",
      {ul: [
        "<strong>Account and verification records</strong>: kept for the life of the subscription, then for the period needed to evidence verification and to defend claims.",
        "<strong>Billing records and invoices</strong>: kept for the period commercial, tax and accounting requirements demand.",
        "<strong>The audit log, the activity ledger and the integrity record</strong>: kept as a record of acts that occurred, and they survive the end of the subscription and the clearing of the posting they relate to, for the period needed for enforcement, for settling disputes and for evidencing sound operation.",
        "<strong>The candidate's profile in the wider Uptal network</strong>: kept while the candidate's consent stands, and deleted or stripped of identifying elements on withdrawal or when it is no longer needed.",
        "<strong>Security logs</strong>: kept for the period needed to detect incidents, investigate them and prevent their recurrence."
      ]},
      "On closure of a dashboard, live postings end immediately, candidates still under consideration are notified, team access is revoked, and deletion of dashboard data is scheduled for the end of the retention periods. The entity may export its dashboard data before closure; that export is available without any verification requirement and at no charge, as is the download of invoices.",
      "Data is deleted or stripped of identifying elements when its period ends. Stripped and aggregated data is kept without any time limit as set out in section 14."
    ]],
    ["Security and records of activity", [
      "Uptal applies encryption in transit and at rest, permission based access control, least privilege for internal access, separation of operating environments, and continuous monitoring of security events.",
      "Every act on the board is recorded in an audit log with the name and role of the person who performed it and the date, including the opening of sealed profiles, the opening of a curriculum vitae, reveals of data, decisions, exports and changes of permission. Uptal may examine those records and use them for enforcement, for investigation, for settling disputes and for bringing and defending claims, without prior notice.",
      "The subscribing entity is responsible for protecting access to its dashboard: safeguarding sign-in details, confining invitations to addresses on its corporate domain, withdrawing the permission of anyone whose relationship with it has ended, and informing Uptal as soon as unauthorized access is suspected.",
      "No system can be guaranteed absolutely secure. Uptal exercises the care set out in this section, gives no assurance beyond it, and bears no consequence for an incident originating in the entity's environment, in its users' devices, or in their sign-in details."
    ]],
    ["Automated processing", [
      "Matching and screening are automated. The matching engine compares a posting's requirements with the data in candidate profiles, orders the submissions, seals the identity of those it presents, and determines who is presented to the entity and who is not, without a human review of each case.",
      "The notes of the intro call are produced automatically from the course of the call and from sealed profile data, are available to both parties, and contain no names and no contact details.",

    ["The rights of the people whose data this is", [
      "Every person whose personal data is processed on the board holds the following rights, and exercises them at no charge:",

    ["Cookies, storage on the device and analytics", [

    ["Changes to this policy", [
      "Uptal may amend this policy at any time and at its sole discretion. The version in force is published in the dashboard and on the legal page, and each version carries the date it takes effect.",

    ["المعالجون من الباطن", [

DOCS.dpa.en = {
  title: "Data Processing Terms",
  sub: "Applies to Uptal's processing of personal data on the Customer's behalf, and to what each party processes on its own account.",
  intro: "These terms form an integral part of the agreement between Uptal Information Technology Company and the Customer, and govern the processing of personal data on the board, the Uptal Recruiter service. Terms defined in the Terms of Service carry the same meaning here. By using the dashboard the Customer accepts these terms in full, and they alone constitute the Customer's documented instructions to Uptal.",
  s: [
    ["Scope and the position of each party", [
      "Uptal processes personal data in two positions: one in which it determines the purposes and the means of processing on its own account, and one in which it acts on the Customer's behalf and on the Customer's documented instructions. The Customer holds a controller position only over what it lawfully takes out of the board. This clause states what falls in each, and no other provision of these terms displaces it.",
      "<strong>Uptal is the controller of candidates' personal data at all times while that data is inside the board.</strong> A reveal to the Customer does not change that position, and it holds whether the candidate applied to the Customer's posting or came from the wider Uptal network of professionals. It covers the professional profile, the curriculum vitae, identification and contact data, the notes of the intro call, and the record of every reveal. The Customer holds no controller position in that data while it is inside the board, and no right to direct Uptal in respect of it.",
      "Uptal is also the controller, on its own account, of account, verification and authorized signer data, the integrity record, activity, audit and security records, the technical data generated by operating the board, and billing data.",
      "The Customer becomes an independent controller of candidates' personal data only in respect of what it lawfully takes out of the board, through the integrations, through an export, or by any other means the board expressly allows. From the moment that data leaves the board the Customer processes it for its own account, on its own basis and under its own responsibility alone, and bears alone every obligation arising from that processing. Taking data out does not end Uptal's position as the controller of the copy that remains inside the board.",
      "<strong>Uptal is the processor, acting on the Customer's behalf, of the Customer's own dashboard records alone:</strong> postings and their requirements, team and permission records, the decisions the Customer takes on applicants and the reasons it gives for them, the notes its users write, and the outcomes it records. The Customer is the controller of those records alone.",
      "Anonymised and aggregated data, and the insights derived from it, remain the property of Uptal and fall outside these terms, provided they identify neither the Customer nor any individual.",
      {note: "Every dashboard is registered on the footing that it may be consolidated into the dashboard of the entity that verifies the same corporate domain, and the Customer gives that authorization for its own dashboard. Uptal notifies the users of a dashboard when it is consolidated. On consolidation the dashboard records pass to the verified dashboard and the verified entity becomes their controller, and Uptal's position as the controller of candidates' personal data is unchanged."}
    ]],
    ["Subject matter, nature, purpose and duration", [
      "The subject matter of the processing is the operation of the dashboard for the Customer, for one purpose: hiring for real vacancies at the Customer's own entity.",
      "The nature of the processing covers collection, recording, organisation, storage, access and use within the board, presentation to the Customer, transmission between the components of the service, the keeping of backups, the writing of audit records, and anonymisation or deletion.",
      "The purpose is confined to performing the agreement: publishing postings, presenting pre-screened applicants, recording decisions, managing the team, the seats and the job slots, operating the intro call and invitations, issuing invoices, and securing the service and protecting it from misuse.",
      "Processing runs from registration until the dashboard is closed or the agreement ends, and then for the retention period set out in these terms.",
      "Uptal may change the scope of the service and its components at any time at its sole discretion, and the processing changes accordingly without any amendment to these terms being required."
    ]],
    ["Categories of data and of people", [
      "The people whose data is processed are:",
      {ul: [
        "The Customer's team members and those it invites to the dashboard.",
        "The authorized signer and the Customer's representatives for verification and billing.",
        "Applicants to the Customer's own postings.",
        "Candidates presented from the wider Uptal network of professionals."
      ]},
      "The categories of data are:",
      {ul: [
        "Identification and contact data, which stays sealed until an authorized reveal.",
        "Professional data: experience, education, skills, salary expectation and city.",
        "Application data, decisions, their reasons and their windows.",
        "Intro call notes and the notes the Customer writes.",
        "Seat, permission and seat request records.",
        "Activity and audit records, and the record of every reveal.",
        "Billing contact data."
      ]},
      {warn: "The Customer may not enter sensitive data, or data not necessary for the vacancy, into any text field or attachment, including health, biometric, belief, family, criminal and financial data. Any such data the Customer enters is its responsibility alone, and Uptal may delete it without notice and without liability."},
      "The Customer may not upload personal data from sources outside the board into the dashboard, other than what is necessary to manage its own team."
    ]],
    ["The Customer's instructions and their limits", [
      "The Customer's documented instructions are confined to these terms, the Terms of Service, and the acts the Customer performs through the standard functions of the dashboard. No other instruction binds Uptal unless Uptal accepts it in writing.",
      "<strong>Uptal may refuse any instruction that falls outside the ordinary operation of the service</strong>, and performing an instruction carries no charge beyond the subscription fees set out in the Terms of Service.",
      "Uptal may refuse or stop, without liability, any instruction that:",
      {ul: [
        "Breaches the agreement or the Acceptable Use policy.",
        "Affects the security or the performance of the service, other customers, or the network.",
        "Calls for development, configuration or operation outside the standard features.",
        "Uptal considers unlawful or likely to expose it to liability.",
        "Affects the rights of individuals or the protections candidates hold on the board."
      ]},
      "Uptal is under no obligation to assess the lawfulness of the Customer's instructions, and assessing one instruction creates no recurring obligation and no acceptance of any other. Where Uptal considers an instruction to fall outside scope, it may suspend the performance of it, or the access connected to it, immediately and without notice.",
      "The Customer remains responsible for the accuracy and the sufficiency of its instructions and for every consequence of performing them."
    ]],
    ["Purpose limitation and the limits on the Customer's use", [
      "Candidate data is revealed to the Customer for the purpose of the specific vacancy it relates to, and for no other. The full curriculum vitae opens when the Customer shortlists the candidate, and the candidate's identity and contact details open only when the Customer issues an interview invitation. A profile unlock in the wider network is the only reveal of identity permitted before an invitation, and it is subject to the same limits.",
      "The Customer may not:",
      {ul: [
        "Reuse the data for another vacancy or for a future need.",
        "Transfer it to an affiliate or to any third party, or make it available to anyone not working on that same vacancy.",
        "Build a candidate database or a parallel record, inside its own systems or outside them.",
        "Contact a candidate outside the board before that candidate's details have been revealed through the board.",
        "Combine, enrich or match the data against any other source.",
        "Use it to train any automated model, or in any analysis unrelated to that same vacancy.",
        "Extract it automatically, copy it in bulk, or keep it once the need for it has ended."

      {warn: "Any use of candidate data outside the vacancy it was revealed for is a material breach, and results in immediate termination of the dashboard without refund, in addition to full indemnification and to every other claim available to Uptal."},
      "Where the Customer connects the applicant tracking system or the API, it undertakes that the same limits apply to every record carried out through the integration, that it deletes those records on the same retention schedule, and that it remains responsible for them as an independent controller.",
      "Uptal may measure compliance with this clause through activity records and reveal records, and may, on suspicion, restrict access, suspend the dashboard or terminate it immediately, at its sole discretion, without notice and without refund."

    ["The Customer's warranties and indemnity", [
      "The Customer represents and warrants that it holds a proper and sufficient basis for every item of personal data it enters into the board or makes available on it, that it has given the notices and obtained the consents required towards the individuals concerned, and that it collected that data lawfully.",
      "The Customer represents and warrants that every later use of what it takes out of the board, and every retention, transfer or destruction of it, rests on a proper basis and falls within the purpose set out in these terms, and that its own systems and procedures protect it.",

      "The Customer shall indemnify Uptal, its directors, its personnel and those it engages, in full, against every claim, action, fine, award, cost and legal fee arising from its breach of these terms, from its processing of personal data, or from its instructions, whatever the source of the claim, whether an individual, a competent authority or any other party.",
      "<strong>This indemnity is not subject to any limitation of liability under the agreement.</strong> Uptal may conduct the defence of any such claim at the Customer's cost, and the Customer may not enter into any settlement affecting Uptal without Uptal's prior written consent."

    ["Confidentiality of personnel and security measures", [
      "Uptal binds every member of its personnel with access to personal data by a written confidentiality obligation that survives the end of the relationship, limits access to those who need it to perform their work, and grants them the least privilege necessary. The selection and the assignment of personnel remain a matter for Uptal alone.",
      "Uptal applies appropriate technical and organizational measures to protect the data, including:",
      {ul: [

      "The sufficiency of these measures is judged by what is appropriate to the risk and available technically. Uptal may amend or replace them at any time at its discretion, provided the overall level of protection is not materially reduced.",
      "Uptal does not warrant absolute security or uninterrupted operation. The Customer bears responsibility for protecting the means of access to its dashboard, for managing its seats and permissions, for protecting its integration keys, for the security of its own devices and systems, and for every act performed under its account."

    ["Sub-processors", [
      "The Customer gives Uptal a general authorization to engage sub-processors for hosting, security, messaging, payments, support and the like.",
      "Uptal alone appoints a sub-processor, replaces one, or ends its engagement, at its sole discretion. Uptal notifies the Customer of a new sub-processor through a notification in the dashboard, which also reaches the work email registered on the account. <strong>The Customer holds no right of objection that prevents or delays an appointment.</strong>",
      "A Customer that objects has one course alone: to stop using the component concerned where that is possible, or to decline renewal at the end of the paid period, without refund and without any further right.",
      "Uptal binds every sub-processor to obligations no less protective in substance than those set out here, and remains responsible for its performance within the limitation of liability set out in the Terms of Service. Where a security or legal necessity calls for an urgent appointment, notice may follow the appointment."
    ]],
    ["Assistance and requests from individuals", [
      "Uptal answers, itself, requests from individuals concerning the data it processes on its own account, including candidates' personal data while it is inside the board.",
      "Requests concerning dashboard records are answered by the Customer as the controller, and Uptal assists it through the standard tools of the dashboard: access, correction, export and deletion.",
      "That assistance is confined to what is reasonable and possible through those tools. Any support, search or reporting beyond them is subject to Uptal's acceptance, and Uptal may decline what falls outside the ordinary operation of the service.",
      "The Customer shall pass to Uptal, at help@uptal.com, every request, complaint or communication it receives concerning a candidate presented from the wider network, within 3 business days, and shall not answer on Uptal's behalf or accept any obligation for it.",
      {note: "Nothing in these terms affects the rights individuals hold, or Uptal's own obligations towards them as the controller of their data. No instruction from the Customer that conflicts with those rights or those obligations is performed."}
    ]],
    ["Security incidents", [
      "Uptal notifies the Customer without undue delay after it confirms a security incident affecting the personal data it processes on the Customer's behalf, provides the information available to it at the time of notification, and supplements that information as it becomes available.",
      "Neither the notification nor any step Uptal takes in respect of an incident is an admission of fault or of liability.",
      "The Customer alone makes any notification it owes to individuals or to a competent authority in respect of its dashboard records, and bears the cost of doing so. The Customer may not name Uptal in any notification or public statement without Uptal's prior written consent, except where the law requires otherwise.",
      "The Customer shall notify Uptal immediately on becoming aware of any unauthorized access to its dashboard, or of any leak of data originating from the board, and shall cooperate fully in containing and addressing the effect."

    ["Location of processing, retention and deletion", [
      "Candidate data and dashboard data are processed and stored within the Kingdom of Saudi Arabia, and no processing of them takes place outside it except within the limits the law permits and with the safeguards it requires. Ordinary third party infrastructure used to deliver the interface itself, such as fonts and style files requested from external content delivery networks, is not covered by the preceding sentence and carries no candidate data and no dashboard data.",
      "Retention runs as follows:",
      {ul: [

      "<strong>On closure or termination, the Customer's own export of its data from the dashboard is its only means of recovering that data</strong>, and it is available at any time before closure, with no verification of the entity required. Uptal is under no obligation to deliver the data in another format, at another time, or after the dashboard is closed.",

    ["Audit", [

/* ---------------- render ---------------- */
var ORDER = ["terms","refund","privacy","dpa","aup"];
var current = "terms";

function esc(x){ return String(x == null ? "" : x).replace(/[&<>"]/g, function(c){
  return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }

function blockHTML(b){
  if (typeof b === "string") return "<p>" + b + "</p>";
  if (b.ul) return "<ul>" + b.ul.map(function(li){ return "<li>" + li + "</li>"; }).join("") + "</ul>";
  if (b.note) return '<div class="note"><p>' + b.note + "</p></div>";
  if (b.warn) return '<div class="note warn"><p>' + b.warn + "</p></div>";
  return "";
}

function renderDoc(key){
  var d = DOCS[key][LANG];
  var host = document.getElementById("doc-" + key);
  host.innerHTML =
    '<div class="card"><h2>' + esc(d.title) + "</h2>" +
    '<p class="sub">' + esc(d.sub) + "</p>" +
    "<p>" + d.intro + "</p>" +
    d.s.map(function(sec, i){
      return "<section><h3><i>" + (i + 1) + ".</i>" + esc(sec[0]) + "</h3>" +
        sec[1].map(blockHTML).join("") + "</section>";
    }).join("") +
    "</div>";
}

function renderNav(){
  document.getElementById("docNav").innerHTML = ORDER.map(function(k){
    return '<button type="button" data-doc="' + k + '" class="' + (current === k ? "on" : "") + '">' +
      esc(UI[LANG]["nav_" + k]) + "</button>";
  }).join("");
}

function show(key){
  current = key;
  ORDER.forEach(function(k){
    document.getElementById("doc-" + k).classList.toggle("on", k === key);
  });
  renderNav();
  window.scrollTo(0, 0);
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = LANG === "ar" ? "أبتال ريكروتر · الشؤون النظامية" : "Uptal Recruiter · Legal";
  document.getElementById("langBtn").textContent = LANG === "ar" ? "English" : "عربي";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(el){
    el.textContent = UI[LANG][el.getAttribute("data-i18n")] || "";
  });
  ORDER.forEach(renderDoc);
  renderNav();
  show(current);
}

document.getElementById("langBtn").addEventListener("click", function(){
  LANG = LANG === "ar" ? "en" : "ar";
  try { localStorage.setItem("uptal_pjb_lang", LANG); } catch(e){}
  applyLang();
});
document.getElementById("docNav").addEventListener("click", function(e){
  var b = e.target.closest("[data-doc]");
  if (b){
    show(b.getAttribute("data-doc"));
    /* keep the address bar in step so a chosen document stays linkable */
    try { history.replaceState(null, "", "#" + b.getAttribute("data-doc")); } catch(err){}
  }
});

/* arriving from the landing page: honour the requested document and language.
   The hash is validated against ORDER first: show() only toggles ids it knows,
   so an unrecognized key would hide every document and leave a blank page. */
(function(){
  var h = (location.hash || "").replace(/^#/, "");
  if (ORDER.indexOf(h) !== -1) current = h;
  var q = /[?&]lang=(ar|en)\b/.exec(location.search);
  var stored = null; try { stored = localStorage.getItem("uptal_pjb_lang"); } catch(e){}
  if (q) LANG = q[1];
  else if (stored === "ar" || stored === "en") LANG = stored;
})();
window.addEventListener("hashchange", function(){
  var h = (location.hash || "").replace(/^#/, "");
  if (ORDER.indexOf(h) !== -1 && h !== current) show(h);
});

applyLang();

</script>
