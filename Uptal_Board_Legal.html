<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uptal Private Board · Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#061430; --slate:#33405C; --muted:#7C8496; --hair:#E4E7EF; --hair-2:#D3D8E6;
    --paper:#F6F7FB; --persian:#3730D8; --persian-tint:#EEEEFD; --red-ink:#B23C39;
    --r-card:14px; --maxw:760px;
  }
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.75;
    font-feature-settings:"kern","liga"}
  html[lang=ar] body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.95}
  .num{font-variant-numeric:tabular-nums}

  .topbar{position:sticky;inset-block-start:0;z-index:20;background:var(--ink);color:#fff;
    display:flex;align-items:center;gap:12px;padding:14px 20px}
  .logo{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .logo span{opacity:.62;font-weight:500}
  .lang{margin-inline-start:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);
    border-radius:999px;padding:7px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .lang:hover{background:rgba(255,255,255,.1)}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:26px 20px 80px}
  .head{margin-block-end:22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--persian);margin:0 0 8px}
  html[lang=ar] .eyebrow{letter-spacing:0;text-transform:none;font-size:12.5px}
  h1{font-size:29px;line-height:1.25;margin:0 0 8px;letter-spacing:-.02em}
  html[lang=ar] h1{letter-spacing:0}
  .lead{color:var(--slate);margin:0}
  .stamp{margin-block-start:12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--hair);padding-block-start:12px}

  .docnav{display:flex;flex-wrap:wrap;gap:8px;margin-block:20px 26px}
  .docnav button{background:#fff;border:1px solid var(--hair-2);border-radius:999px;padding:8px 15px;
    font:inherit;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer}
  .docnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .doc{display:none}
  .doc.on{display:block}
  .card{background:#fff;border:1px solid var(--hair);border-radius:var(--r-card);padding:22px 24px;margin-block-end:14px}
  h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  html[lang=ar] h2{letter-spacing:0}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 4px}
  section{margin-block-start:26px}
  h3{font-size:15.5px;margin:0 0 6px;display:flex;gap:9px;align-items:baseline}
  h3 i{font-style:normal;color:var(--persian);font-weight:700;font-size:13px;flex:none}
  p{margin:0 0 11px;color:var(--slate)}
  ul{margin:0 0 11px;padding-inline-start:20px;color:var(--slate)}
  li{margin-block-end:6px}
  strong{color:var(--ink);font-weight:600}
  .note{background:var(--persian-tint);border:1px solid #DCDCFA;border-radius:10px;padding:13px 15px;margin-block:14px 0}
  .note p{margin:0;color:var(--ink);font-size:13.5px}
  .warn{background:#FDF3F2;border-color:#F3D9D7}
  .warn p{color:var(--red-ink)}
  .foot{margin-block-start:30px;padding-block-start:16px;border-top:1px solid var(--hair);
    font-size:12.5px;color:var(--muted)}
  @media (max-width:560px){
    .wrap{padding:20px 15px 64px}
    h1{font-size:24px}
    .card{padding:18px 16px}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="logo">Uptal <span data-i18n="brand_sub"></span></span>
  <button class="lang" id="langBtn" type="button">عربي</button>
</header>

<div class="wrap">
  <div class="head">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <p class="stamp" data-i18n="stamp"></p>
  </div>

  <nav class="docnav" id="docNav"></nav>

  <div class="doc" id="doc-terms"></div>
  <div class="doc" id="doc-privacy"></div>
  <div class="doc" id="doc-dpa"></div>
  <div class="doc" id="doc-aup"></div>

  <p class="foot" data-i18n="foot"></p>
</div>

DOCS.privacy.en = {
  title: "Privacy Policy",
  sub: "How Uptal handles personal data on the private board, under the Personal Data Protection Law of the Kingdom of Saudi Arabia.",
  intro: "This policy explains what personal data Uptal collects on the Uptal Private Board, why it is processed, and the rights available under the Personal Data Protection Law and its Implementing Regulations. It applies to employer users of the board and to candidates presented through it.",
  s: [
    ["Who is responsible", [
      "Uptal Information Technology Company, Riyadh, Kingdom of Saudi Arabia, is the data controller for candidate data held in its network, for account and verification data, and for data generated by operating the board.",
      "The subscribing entity is the data controller for its own dashboard records, including its postings, its team records and the hiring decisions it takes. Uptal processes those records on the entity's behalf under the Data Processing Terms.",
      "Contact for privacy matters: privacy@uptal.com"
    ]],
    ["Data we collect", [
      "<strong>Account and verification data</strong>: entity name, commercial registration or official government domain, website, organization profile, the authorized signer's name, work email, role, phone and professional profile, and the verification signals resolved during activation.",
      "<strong>Dashboard data</strong>: postings, requirements, decision windows, team members and their roles, decisions taken on applicants, notes, and the audit log of activity.",
      "<strong>Candidate data</strong>: profile, experience, education, skills, salary expectation, city, and contact details, presented under seal until an interview invitation.",
      "<strong>Billing data</strong>: plan, slots, seats, billing term, invoices and payment references. Card and bank credentials are handled by the payment provider on its own secured page and are never collected or stored by Uptal.",
      "<strong>Technical data</strong>: device, browser, approximate location derived from network address, log and security events."
    ]],
    ["Why we process it", [
      "To verify that an entity is real and eligible, and to activate, operate and secure its dashboard.",
      "To match candidates to postings, to present pre-screened applicants, and to record decisions.",
      "To measure conduct on the board and enforce the hiring integrity rules.",
      "To bill, invoice and meet tax and accounting obligations.",
      "To detect, prevent and investigate fraud, abuse, scraping and security incidents.",
      "To improve the service, including through anonymised and aggregated analysis that identifies no individual and no entity."
    ]],
    ["Legal bases", [
      "Processing rests on the performance of the agreement with the subscribing entity, on the consent given by candidates when they join the Uptal network, on Uptal's legitimate interests in operating and protecting the board, and on compliance with legal obligations in the Kingdom."
    ]],
    ["Disclosure of candidate identity", [
      "A candidate's name and contact details are disclosed to an employer only when that employer issues an interview invitation for the specific vacancy.",
      "Before that point the employer sees the professional substance of the profile and no identifying detail.",
      {note: "An employer that receives candidate details may use them only for the vacancy they relate to, and may not transfer them, reuse them for another vacancy, or retain them beyond the retention schedule."}
    ]],
    ["Sharing", [
      "Uptal does not sell personal data.",
      "Data is shared with service providers that host, secure, deliver messages, or process payments for Uptal, each bound by written terms and permitted to process only on Uptal's instructions.",
      "Data may be disclosed to a competent authority in the Kingdom where required by law or by valid legal process, and in connection with a corporate transaction, subject to equivalent protections."
    ]],
    ["Storage location and transfers", [
      "Dashboard and candidate data is processed and stored within the Kingdom of Saudi Arabia. Any transfer outside the Kingdom takes place only where the Personal Data Protection Law permits it and with the safeguards it requires."
    ]],
    ["Retention", [
      "Candidate details clear from a posting sixty days after publication.",
      "Account, verification, billing and audit records are retained for the period required by the applicable commercial, tax and regulatory rules, and are then deleted or anonymised.",
      "On dashboard closure, the entity may export its data first; deletion then follows the retention schedule."
    ]],
    ["Security", [
      "Uptal applies encryption in transit and at rest, role based access control, least privilege for internal access, signed audit logging of every decision, and continuous monitoring. No system can be guaranteed absolutely secure, and the Customer is responsible for safeguarding access to its own dashboard."
    ]],
    ["Your rights", [
      "Subject to the Personal Data Protection Law, individuals may request access to their personal data, request correction, request destruction where retention is no longer required, and withdraw consent where processing rests on consent.",
      "Requests are made to privacy@uptal.com and are answered within the statutory period. Uptal may verify identity before acting and may decline a request where the law permits, including where retention is required for a legal or regulatory purpose.",
      "Complaints may be raised with the competent supervisory authority in the Kingdom."
    ]],
    ["Automated processing", [
      "Matching, screening and account verification involve automated processing of the data described above. Uptal reviews and may override any automated outcome. Individuals may request a review of a decision that produces a legal effect on them."
    ]],
    ["Changes", [
      "This policy may be updated at any time. The current version is published in the dashboard, and continued use after an update constitutes acceptance."
    ]]
  ]
};

/* ---------------- render ---------------- */
var ORDER = ["terms","privacy","dpa","aup"];
var current = "terms";

function esc(x){ return String(x == null ? "" : x).replace(/[&<>"]/g, function(c){
  return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }

function blockHTML(b){
  if (typeof b === "string") return "<p>" + b + "</p>";
  if (b.ul) return "<ul>" + b.ul.map(function(li){ return "<li>" + li + "</li>"; }).join("") + "</ul>";
  if (b.note) return '<div class="note"><p>' + b.note + "</p></div>";
  if (b.warn) return '<div class="note warn"><p>' + b.warn + "</p></div>";
  return "";
}

function renderDoc(key){
  var d = DOCS[key][LANG];
  var host = document.getElementById("doc-" + key);
  host.innerHTML =
    '<div class="card"><h2>' + esc(d.title) + "</h2>" +
    '<p class="sub">' + esc(d.sub) + "</p>" +
    "<p>" + d.intro + "</p>" +
    d.s.map(function(sec, i){
      return "<section><h3><i>" + (i + 1) + ".</i>" + esc(sec[0]) + "</h3>" +
        sec[1].map(blockHTML).join("") + "</section>";
    }).join("") +
    "</div>";
}

function renderNav(){
  document.getElementById("docNav").innerHTML = ORDER.map(function(k){
    return '<button type="button" data-doc="' + k + '" class="' + (current === k ? "on" : "") + '">' +
      esc(UI[LANG]["nav_" + k]) + "</button>";
  }).join("");
}

function show(key){
  current = key;
  ORDER.forEach(function(k){
    document.getElementById("doc-" + k).classList.toggle("on", k === key);
  });
  renderNav();
  window.scrollTo(0, 0);
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = LANG === "ar" ? "لوحة أبتال الخاصة · الشؤون النظامية" : "Uptal Private Board · Legal";
  document.getElementById("langBtn").textContent = LANG === "ar" ? "English" : "عربي";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(el){
    el.textContent = UI[LANG][el.getAttribute("data-i18n")] || "";
  });
  ORDER.forEach(renderDoc);
  renderNav();
  show(current);
}

document.getElementById("langBtn").addEventListener("click", function(){
  LANG = LANG === "ar" ? "en" : "ar";
  try { localStorage.setItem("uptal_pjb_lang", LANG); } catch(e){}
  applyLang();
});
document.getElementById("docNav").addEventListener("click", function(e){
  var b = e.target.closest("[data-doc]");
  if (b){
    show(b.getAttribute("data-doc"));
    /* keep the address bar in step so a chosen document stays linkable */
    try { history.replaceState(null, "", "#" + b.getAttribute("data-doc")); } catch(err){}
  }
});

/* arriving from the landing page: honour the requested document and language.
   The hash is validated against ORDER first — show() only toggles ids it knows,
   so an unrecognized key would hide every document and leave a blank page. */
(function(){
  var h = (location.hash || "").replace(/^#/, "");
  if (ORDER.indexOf(h) !== -1) current = h;
  var q = /[?&]lang=(ar|en)\b/.exec(location.search);
  var stored = null; try { stored = localStorage.getItem("uptal_pjb_lang"); } catch(e){}
  if (q) LANG = q[1];
  else if (stored === "ar" || stored === "en") LANG = stored;
})();
window.addEventListener("hashchange", function(){
  var h = (location.hash || "").replace(/^#/, "");
  if (ORDER.indexOf(h) !== -1 && h !== current) show(h);
});

applyLang();

</script>
</body>
</html>
