<title>Uptal Recruiter · Legal</title>

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#061430; --slate:#33405C; --muted:#7C8496; --hair:#E4E7EF; --hair-2:#D3D8E6;
    --paper:#F6F7FB; --persian:#3730D8; --persian-tint:#EEEEFD; --red-ink:#B23C39;
    --r-card:14px; --maxw:760px;
  }
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.75;
    font-feature-settings:"kern","liga"}
  html[lang=ar] body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.95}
  .num{font-variant-numeric:tabular-nums}

  .topbar{position:sticky;inset-block-start:0;z-index:20;background:var(--ink);color:#fff;
    display:flex;align-items:center;gap:12px;padding:14px 20px}
  .logo{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .logo span{opacity:.62;font-weight:500}
  .lang{margin-inline-start:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);
    border-radius:999px;padding:7px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .lang:hover{background:rgba(255,255,255,.1)}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:26px 20px 80px}
  .head{margin-block-end:22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--persian);margin:0 0 8px}
  html[lang=ar] .eyebrow{letter-spacing:0;text-transform:none;font-size:12.5px}
  h1{font-size:29px;line-height:1.25;margin:0 0 8px;letter-spacing:-.02em}
  html[lang=ar] h1{letter-spacing:0}
  .lead{color:var(--slate);margin:0}
  .stamp{margin-block-start:12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--hair);padding-block-start:12px}

  .docnav{display:flex;flex-wrap:wrap;gap:8px;margin-block:20px 26px}
  .docnav button{background:#fff;border:1px solid var(--hair-2);border-radius:999px;padding:8px 15px;
    font:inherit;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer}
  .docnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .doc{display:none}
  .doc.on{display:block}
  .card{background:#fff;border:1px solid var(--hair);border-radius:var(--r-card);padding:22px 24px;margin-block-end:14px}
  h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  html[lang=ar] h2{letter-spacing:0}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 4px}
  section{margin-block-start:26px}
  h3{font-size:15.5px;margin:0 0 6px;display:flex;gap:9px;align-items:baseline}
  h3 i{font-style:normal;color:var(--persian);font-weight:700;font-size:13px;flex:none}
  p{margin:0 0 11px;color:var(--slate)}
  ul{margin:0 0 11px;padding-inline-start:20px;color:var(--slate)}
  li{margin-block-end:6px}
  strong{color:var(--ink);font-weight:600}
  .note{background:var(--persian-tint);border:1px solid #DCDCFA;border-radius:10px;padding:13px 15px;margin-block:14px 0}
  .note p{margin:0;color:var(--ink);font-size:13.5px}
  .warn{background:#FDF3F2;border-color:#F3D9D7}
  .warn p{color:var(--red-ink)}
  .foot{margin-block-start:30px;padding-block-start:16px;border-top:1px solid var(--hair);
    font-size:12.5px;color:var(--muted)}
  @media (max-width:560px){
    .wrap{padding:20px 15px 64px}
    h1{font-size:24px}
    .card{padding:18px 16px}
  }
</style>
</head>

<header class="topbar">

      "ومن سجّل الدخول على عنوان لوحة مضمومة وصل إلى اللوحة المتحقَّق منها. ومتى كان النطاق مقيَّداً من قبل، ضُمت إليه أي لوحة تتحقق عليه لاحقاً، ولا ينشأ للمتحقق الثاني حساب مستقل.",
      {warn: "الضم إجراء نهائي لا رجعة فيه. ولا تتحمل أبتال أي مسؤولية تجاه العميل عن أثره في ترتيبات العميل الداخلية أو في سرية معلوماته بين إداراته. وتنظيم الوصول داخل الجهة بعد الضم مسؤولية مسؤول الحساب وحده."},
      {note: "ينقل الضم بيانات شخصية للكفاءات بين لوحات تحكم مسجلة على النطاق المؤسسي نفسه. وأثر ذلك في البيانات الشخصية موضح في سياسة الخصوصية."}
    ]],
    ["الخدمة، وانتفاء الوعد بأي نتيجة", [
      "تطابق أبتال مرشحين من شبكتها مع إعلانات العميل، وتعرض متقدمين مفروزين داخل لوحة التحكم. واللوحة خاصة: لا تُدرج الإعلانات علناً ولا تُفهرس ولا يطلع عليها صاحب عمل آخر.",
      {warn: "<strong>لا تَعِد أبتال ولا تضمن أي تعيين ولا أي عرض عمل ولا أي مقابلة ولا أي عدد من المتقدمين ولا أي مستوى من جودتهم ولا أي مدة للوصول إليهم ولا أي نتيجة توظيف على الإطلاق.</strong> والخدمة بذل جهد لعرض مرشحين مناسبين، ولا يشكل أي نص في هذه الشروط ولا في أي مراسلة أو عرض تقديمي أو مادة تسويقية من أبتال وعداً بنتيجة ولا أساساً للاعتماد عليه."},
      "وتُقدَّم اللوحة <strong>كما هي</strong> و<strong>بحسب توافرها</strong>، دون أي ضمان صريح أو ضمني من أي نوع، إلى أقصى حد تجيزه الأنظمة. ولا تضمن أبتال استمرار عمل اللوحة دون انقطاع، ولا خلوها من الأخطاء، ولا دقة ما يقدمه المرشحون من معلومات، ولا ملاءمة اللوحة لغرض بعينه.",
      "ولا ترتبط اللوحة بأي التزام بمستوى خدمة. ولا تُمنح أرصدة خدمة ولا تعويضات ولا خصومات عن أي انقطاع أو بطء أو صيانة أو تعطل لأي مدة.",
      "ولأبتال وحدها ووفق تقديرها المطلق تعديل اللوحة أو أي ميزة فيها، أو إضافة مزايا، أو تغيير حدودها وسعتها، أو سحبها كلياً أو جزئياً، في أي وقت ودون إشعار مسبق. وإذا قلّص التغيير ميزة مدفوعة، فحق العميل الوحيد والحصري هو الامتناع عن التجديد.",
      "والمقابلات وعروض العمل والتعاقد والتعيين تقع خارج اللوحة وبين العميل والمرشح مباشرةً. ولا تكون أبتال طرفاً في أي علاقة عمل ولا في التفاوض عليها، ولا تتحمل أي التزام ناشئ عنها.",
      "ويتحمل العميل وحده كل التزام ناشئ عن توظيفه وعن قراراته وعن علاقاته العمالية، ومنه ما يتعلق بالإعلان والمفاضلة والتعاقد والأجور، دون أي رجوع على أبتال."
    ]],
    ["المقاعد والصلاحيات وبيانات الدخول", [
      "تشمل كل لوحة تحكم مقعداً واحداً. ويُفتح مقعد ثانٍ دون مقابل عند التحقق. وتُتاح المقاعد بعد الثاني للشراء بعد التحقق وحده، بقيمة 75 ريالاً لكل مقعد شهرياً غير شامل ضريبة القيمة المضافة.",
      "وتقتصر دعوات الفريق على عناوين البريد على النطاق المؤسسي المسجل للعميل أو على نطاق فرعي منه. ولا يجوز دعوة شخص من خارج الجهة، ولا مشاركة مقعد بين شخصين، ولا استخدام مقعد باسم غير من يشغله فعلاً.",
      "وتتبع صلاحيات الوصول الصلاحية الممنوحة في لوحة التحكم. ولا يغيّر الباقة ولا المقاعد ولا الشواغر النشطة ولا وسائل الدفع إلا مسؤول الحساب.",
      "ويظل العميل مسؤولاً عن حفظ بيانات الدخول وعن كل استخدام يقع بها. ولا تتحمل أبتال أي مسؤولية عن وصول غير مصرح به ناشئ عن إهمال العميل أو عن مشاركة بيانات الدخول أو عن أجهزة العميل وشبكاته."
    ]],
    ["الإعلانات والشواغر النشطة", [
      "تشمل كل لوحة تحكم شاغراً نشطاً واحداً منذ التسجيل ودون تحقق. ويحمل الشاغر النشط إعلاناً منشوراً واحداً في الوقت نفسه ويُعاد استخدامه دون حد. وتُتاح الشواغر النشطة الإضافية للشراء منذ اليوم الأول بقيمة 375 ريالاً لكل شاغر شهرياً غير شامل ضريبة القيمة المضافة.",
      "ويجب أن يكون كل إعلان لشاغر حقيقي معتمد الميزانية يوظف عليه العميل فعلاً وقت النشر، وأن يكون دقيقاً غير مضلل في المسمى والمهام ونطاق الراتب ومكان العمل، وأن يخص كيان العميل نفسه.",
      {warn: "<strong>يُحظر النشر بقصد جمع الملفات، أو مقارنة الرواتب، أو اختبار سوق العمل، أو بناء قاعدة مرشحين لحاجة مستقبلية، أو لأي غرض غير شغل الشاغر المعلن.</strong> والنشر على خلاف ذلك إقرار غير صحيح يبيح لأبتال إزالة الإعلان وتعليق لوحة التحكم أو إنهاءها فوراً دون إشعار ودون استرداد، واتخاذ ما تراه من إجراءات نظامية."},
      "ويوقّع العميل عند كل نشر إقراراً بجدية الشاغر، ويُسجَّل الإقرار في سجل التدقيق باسم المسؤول المعني. ويلتزم العميل بالبتّ في المتقدمين ضمن المهل المعلنة على اللوحة وبتسجيل نتيجة كل شاغر.",
      "ولأبتال إزالة أي إعلان أو إيقافه مؤقتاً أو تعديل ظهوره وفق تقديرها المطلق، دون إشعار ودون استرداد، متى رأت مخالفته هذه الشروط أو سياسة الاستخدام المقبول أو إضراره بالمرشحين أو باللوحة.",
      "ولا يُعفي شراء شاغر نشط إضافي العميل من أي التزام في هذه الشروط، ولا يمنحه حقاً في عدد معين من المتقدمين."
    ]],
    ["حدود الاستخدام", [
      "تطبق اللوحة حدوداً على قدر الاستخدام في الشاغر الواحد وفي المدة الواحدة. ومن ذلك: حد عدد الترشيحات التي تُطلق على الشاغر الواحد، وحصة دعوات المقابلة على الشاغر الواحد، وميزانية كشف الملفات في شبكة أبتال الموسّعة على الشاغر الواحد والنافذة الزمنية التي تسري فيها، ومهل البتّ في المتقدمين، ومدة مكالمة التعارف وعدد محاولاتها.",
      "والحدود السارية معلنة في لوحة التحكم عند موضع الفعل الذي تحكمه. وهي جزء من الخدمة. ولا حق للعميل في أي سعة تجاوزها، ولا يرفعها شراء شاغر نشط ولا شراء مقعد.",
      "ولأبتال تغيير أي من هذه الحدود وفق البند الخاص بالخدمة، ويسري التغيير من وقت نشره في لوحة التحكم.",
      {note: "وهذه الحدود ضوابط ضد حصاد الهويات وبناء قواعد المرشحين. وليست ميزة مسعّرة، ولا تفرض أبتال أي مقابل لرفع أي منها."}
    ]],
    ["التزامات العميل تجاه بيانات الكفاءات", [
      "تبقى هوية المرشح محجوبة أثناء مراجعة العميل. وتُفتح السيرة الذاتية الكاملة، والهوية ما تزال محجوبة، عند إضافة المرشح إلى القائمة المختصرة. ودعوة المقابلة هي الفعل الذي يكشف الاسم ووسائل التواصل، وكشف الملف في شبكة أبتال الموسّعة هو الكشف الوحيد المسموح به قبل الدعوة، في حدود ما تتيحه اللوحة.",
      "وتُفصح أبتال عن البيانات الشخصية للمرشح لغرض الشاغر المحدد الذي عُرض عليه وحده. ويلتزم العميل تجاه أبتال بما يلي:",
      {ul: [
        "قصر استخدام البيانات على تقييم المرشح للشاغر المحدد وحده، وعدم استخدامها لأي شاغر آخر ولو داخل الجهة نفسها.",
        "عدم نسخ البيانات أو تصويرها أو تفريغها أو حفظها خارج لوحة التحكم، إلا ما تتيحه اللوحة صراحةً وفي حدود الشاغر نفسه.",
        "عدم نقل البيانات إلى أي شركة تابعة أو شقيقة أو أم، ولا إلى أي مستشار أو مقاول أو طرف ثالث، إلا بإذن كتابي مسبق من أبتال.",
        "عدم إضافة المرشح إلى قاعدة بيانات أو نظام تتبع متقدمين أو قائمة تواصل أو أي سجل خارج اللوحة بما يتجاوز ما يلزم للشاغر المحدد.",
        "عدم التواصل مع المرشح خارج اللوحة قبل كشف بياناته عبر اللوحة، وعدم محاولة التعرف على هويته بأي وسيلة قبل ذلك.",
        "عدم استخدام اللوحة لبناء قاعدة مرشحين، ولا لتكوين مخزون منهم، ولا لأي غرض تسويقي أو بحثي أو إحصائي.",
        "عدم الكشط الآلي ولا الاستخراج المنظم ولا الوصول الآلي إلى اللوحة بغير ما تتيحه واجهة برمجة التطبيقات (API) المصرح بها.",
        "الاحتفاظ بالبيانات في حدود مدة الاحتفاظ المعلنة على اللوحة وإتلافها بعدها، وتنفيذ أي طلب حذف تحيله أبتال إليه دون تأخير."
      ]},
      "ويلتزم العميل بأن يثبت لأبتال عند الطلب كيفية استخدامه بيانات أي مرشح وموضع حفظها ومدة بقائها، وأن يتعاون في أي فحص تجريه أبتال لهذا الغرض، وأن يبلغها فوراً بأي وصول غير مصرح به إلى تلك البيانات.",
      {warn: "<strong>مخالفة هذا البند مخالفة جسيمة.</strong> وتبيح لأبتال التعليق أو الإنهاء الفوري دون إشعار ودون استرداد، وتوجب على العميل تعويض أبتال تعويضاً كاملاً عن كل ما ينشأ عنها، ومنه المطالبات والغرامات وتكاليف الإبلاغ والمعالجة وأتعاب المحاماة، دون التقيد بأي حد من حدود المسؤولية الواردة في هذه الشروط."},
      {note: "المرشحون ليسوا طرفاً في هذه الاتفاقية. ولا يمس أي نص فيها الحقوق التي يملكها الأشخاص في بياناتهم الشخصية، ولا يحد من التزامات أبتال تجاههم بوصفها الجهة التي تحدد أغراض معالجة تلك البيانات ووسائلها. والالتزامات الواردة في هذا البند مقررة على العميل تجاه أبتال، وتضاف إلى ما يلزمه تجاه الأشخاص أنفسهم."}
    ]],
    ["نزاهة التوظيف وقياس السلوك", [
      "تقيس أبتال السلوك على اللوحة قياساً مستمراً وتحفظ سجل نزاهة لكل لوحة تحكم، بناءً على ما يقع عليها من أفعال وما يُترك منها. وينتج عن السجل درجة ومستوى، وتُعرض الدرجة والمستوى والقيود المكوّنة لهما على العميل في لوحة التحكم.",
      "ومما ينعكس سلباً على السجل: ترشيح مرشحين لا يجري التواصل معهم، وترك الإعلانات دون قرارات، وانقضاء مهل القرار، وعدم تسجيل نتائج الشواغر، ونشر وظائف لا يجري شغلها فعلاً، وأنماط الاستخدام التي تدل على استخراج بيانات أو بناء قاعدة مرشحين.",
      "ويُفتح القيد تلقائياً متى تحققت حالته وتجاوزت حدها، ويزول من تلقاء نفسه متى زالت تلك الحالة. والمستوى الناتج يقيّد الاستقبال وحده: نشر الإعلانات، وإطلاق الترشيحات إلى لوحة التحكم. أما تسجيل القرار في شأن مرشح، ودعوته إلى المقابلة، وكشف ملف يحق للعميل كشفه، وإغلاق الشاغر، فتبقى متاحة في كل المستويات، لأن العميل يجب أن يقدر على تدارك ما يقيسه السجل. ولا ينفذ الانتقال إلى أي من المستويين الأدنيين إلا بعد اعتماد مسؤول مخوّل لدى أبتال، وتبقى لوحة التحكم عند المستوى الذي يعلوهما حتى ذلك الحين.",
      "وللعميل أن يطلب من أبتال كتابةً مراجعة أي قيد أو أي إجراء، وتنظر أبتال في الطلب. ويظل القيد والإجراء قائمين أثناء المراجعة. ولا يرفع القيد الذي لم يزل من تلقاء نفسه إلا أبتال، وهي تفصل في كل ما يتعلق بالنزاهة وفق تقديرها المطلق. وليس الإنهاء أثراً من آثار السجل، وإنما يخضع للبند الخاص بالتعليق والإنهاء.",
      "ولا يترتب على أي قيد أو تقليص سعة لهذا السبب أي استرداد ولا تعويض ولا تمديد لمدة الاشتراك."
    ]],
    ["حظر الالتفاف", [
      "كل مرشح يصل إلى علم العميل عبر اللوحة هو مرشح قدّمته أبتال إليه، سواء تقدم إلى إعلانه أو ورد في شبكة أبتال الموسّعة، وسواء كُشف ملفه أو بقي محجوب الهوية.",
      "<strong>ولمدة 12 شهراً</strong> من تاريخ آخر عرض للمرشح على العميل أو آخر كشف لبياناته، أيهما أحدث، لا يجوز للعميل أن يتعاقد معه ولا أن يستفيد من خدماته خارج اللوحة، بأي صفة وبأي ترتيب، ومن ذلك:",
      {ul: [
        "التوظيف بعقد دائم أو مؤقت أو تحت التجربة.",
        "التعاقد معه بوصفه مستقلاً أو مستشاراً أو مقاولاً، أو عبر منشأة يملكها أو يعمل عبرها.",
        "الاستفادة منه عبر شركة تابعة للعميل أو شقيقة أو أم، أو عبر أي كيان يسيطر عليه العميل أو يشترك معه في السيطرة.",
        "الاستفادة منه عبر وسيط أو مكتب توظيف أو شركة إسناد أو أي طرف ثالث يتصرف لمصلحة العميل.",
        "إحالته إلى أي طرف ثالث للتعاقد معه، أو التوصية به إليه."
      ]},
      "<strong>ولا يمتد هذا البند إلى التعيين الذي وُجدت اللوحة لإنتاجه.</strong> فيُستثنى من الفقرة السابقة كل مرشح وجّه إليه العميل دعوة إلى المقابلة عبر اللوحة وسجّل نتيجتها فيها. وللعميل أن يتعاقد معه بحرية، ولا يستحق لأبتال عليه شيء. والمقابلة وعرض العمل والتعاقد تقع خارج اللوحة بحكم تصميم الخدمة، ولا يُعد سلوك المسار الذي تتيحه اللوحة مخالفةً لهذا البند.",
      "ويلتزم العميل بإبلاغ أبتال كتابةً خلال 7 أيام بأي تعاقد يقع على خلاف ما سبق، وبتزويدها عند الطلب بما يثبت تاريخ التعاقد وشروط الأجر.",
      "وإذا وقع التعاقد على خلاف هذا البند، التزم العميل بأن يدفع لأبتال مبلغاً متفقاً عليه يعادل <strong>12.5% من إجمالي أجر السنة الأولى للمرشح</strong>، يُستحق خلال 30 يوماً من تاريخ المباشرة، إضافة إلى حق أبتال في التعليق أو الإنهاء الفوري وفي المطالبة بكامل ما جاوز ذلك من ضرر.",
      {note: "هذا المبلغ تعويض متفق عليه عن مخالفة هذا البند. وليس رسماً من رسوم الخدمة ولا أتعاب توظيف ولا مقابلاً عن تعيين؛ ولا تفرض أبتال أي مقابل على التعيين نفسه."},
      "ويبقى هذا البند نافذاً بعد انتهاء الاتفاقية أو إنهائها لأي سبب، ويسري ولو وقع التعاقد بعد إغلاق لوحة التحكم."
    ]],
    ["الرسوم والفوترة والضرائب", [
      "السعران الوحيدان على اللوحة هما: شاغر نشط إضافي بقيمة 375 ريالاً شهرياً، ومقعد إضافي بقيمة 75 ريالاً شهرياً، وكلاهما غير شامل ضريبة القيمة المضافة. ولا تفرض أبتال أي مقابل آخر على الخدمة: لا أتعاب توظيف، ولا مقابل نجاح، ولا مقابل عن كل تعيين، ولا حزم كشف ملفات. ويخرج عن ذلك مبلغان لأن أياً منهما ليس مقابلاً عن الخدمة: التعويض المتفق عليه في بند حظر الالتفاف، وهو أثر لمخالفة ذلك البند وليس مقابلاً عن الخدمة ولا عن أي تعيين، واسترداد تكلفة التدقيق الذي يطلبه العميل نفسه وفق شروط معالجة البيانات.",
      "وتُدفع الرسوم بالريال السعودي مقدماً عن المدة التي تغطيها، بوسائل الدفع المتاحة في لوحة التحكم. وتُضاف ضريبة القيمة المضافة بالنسبة السارية وتظهر منفصلة في كل فاتورة. ويتحمل العميل كل ضريبة أو رسم أو استقطاع يُفرض على المقابل، عدا ما يُفرض على دخل أبتال.",
      "وإذا لزم العميل استقطاع أي مبلغ من المقابل، زاد المبلغ المدفوع بما يجعل صافي ما تستلمه أبتال مساوياً للمبلغ المستحق كاملاً.",
      "وإذا سُدّدت الفاتورة عبر تحويل بنكي أو عبر مرجع دفع يصدر عند الشراء، فُعّلت السعة عند تأكد استلام المبلغ.",
      "<strong>وتُدفع كل المبالغ دون أي مقاصة أو خصم أو حجز أو ربط بأي مطالبة.</strong> ولأبتال وحدها أن تجري المقاصة بين ما لها وما عليها.",
      "وعند التأخر في السداد، لأبتال تعليق لوحة التحكم أو تقليص سعتها أو إنهاء الاتفاقية دون إشعار، مع بقاء كامل المبلغ مستحقاً، وتحميل العميل تكاليف التحصيل وأتعاب المحاماة.",
      "<strong>ولأبتال تغيير أسعارها وفق تقديرها المطلق.</strong> ويسري السعر الجديد عند التجديد التالي، ويُعرض في لوحة التحكم قبل نفاذ ذلك التجديد، ويُعد استمرار الاستخدام بعد ذلك التجديد قبولاً به.",
      "وتُصدر الفواتير إلكترونياً وتبقى متاحة للتحميل من لوحة التحكم في كل وقت ودون اشتراط التحقق."
    ]],
    ["مدة الاشتراك والتجديد والإلغاء", [
      "السعة المجانية لا مدة لها ولا تنقضي. وتُشترى السعة المدفوعة للمدة التي يختارها العميل عند الشراء، وهي شهر أو ثلاثة أشهر أو اثنا عشر شهراً، والسعر الشهري واحد أياً كانت المدة المختارة.",
      "<strong>ويتجدد الاشتراك المدفوع تلقائياً عند نهاية كل مدة، لمدة أخرى مماثلة وبالسعة نفسها، ما لم يُلغَ قبل تاريخ التجديد.</strong> ويظهر تاريخ التجديد والسعة والمبلغ الذي سيتجدد في لوحة التحكم في كل وقت، وتُصدر فاتورة كل تجديد إلكترونياً إلى العميل في لوحة التحكم.",
      "وللعميل الإلغاء في أي وقت من لوحة التحكم، وله إزالة أي شاغر نشط أو مقعد في أي وقت. ويقف الإلغاء أو الإزالة التجديد التالي وحده، ولا يقصّر المدة المدفوعة سلفاً، فتستمر إلى نهايتها ولا يُرد عنها شيء.",
      "ويسري تغيير السعر من التجديد التالي وفق بند الرسوم. ويسري تغيير المدة المختارة من التجديد التالي.",
      {note: "وإلغاء الاشتراك ليس إغلاقاً للوحة التحكم. فتستمر لوحة التحكم على السعة المجانية، بما يبقى من البيانات ضمن مدة الاحتفاظ المعلنة، إلى أن يغلقها العميل أو تنهيها أبتال."}
    ]],
    ["عدم قابلية الرسوم للاسترداد", [
      {warn: "<strong>جميع الرسوم غير قابلة للاسترداد، كلياً وجزئياً، إلا حيث تنص هذه الشروط صراحةً على خلاف ذلك.</strong>"},
      "ولا يُمنح استرداد ولا رصيد ولا تسوية نسبية عن شاغر نشط لم يُستخدم، ولا عن مقعد لم يُشغل، ولا عن شاغر أُزيل قبل نهاية مدته، ولا عن تخفيض الباقة، ولا عن مدة تعليق فيما عدا ما تقرره سياسة الاسترداد في شأن التعليق، ولا عن إنهاء للمخالفة، ولا عن سحب التحقق، ولا عن عدم بلوغ نتيجة توظيف، ولا عن أي مدة اختار العميل ألا يستخدم الخدمة فيها.",
      "ويستمر الاشتراك إلى نهاية المدة المدفوعة عند طلب العميل إنهاءه، ولا يُرد عنها شيء. والحالة الوحيدة التي تُرد فيها مدة مدفوعة سلفاً هي إنهاء أبتال للاتفاقية دون سبب وفق بند التعليق والإنهاء.",
      "وتفصيل هذا الموقف يرد في سياسة الاسترداد المنشورة مع هذه الشروط، وهي جزء لا يتجزأ منها، وتحكم الاسترداد وإلغاء الاشتراك وأثر التعليق أو الإنهاء في المدة المدفوعة."
    ]],
    ["الملكية الفكرية والبيانات المشتقة", [
      "اللوحة وبرمجياتها وواجهاتها وتصاميمها ومحرك المطابقة ونماذج النزاهة وقواعد بياناتها ووثائقها وعلاماتها التجارية وكل ما يتصل بها من حقوق ملكية فكرية ملك خالص لأبتال وتبقى كذلك. ولا ينقل أي نص في هذه الشروط أي ملكية ولا أي حق إلى العميل.",
      "ويحصل العميل على حق استخدام محدود غير حصري غير قابل للتنازل ولا للترخيص من الباطن وقابل للإلغاء، لاستخدام اللوحة لتوظيفه هو وحده طوال مدة اشتراكه، دون أي حق آخر.",
      "ولا يجوز للعميل نسخ أي جزء من اللوحة ولا تعديله ولا اشتقاق أعمال منه ولا هندسته العكسية ولا تفكيكه ولا كشطه ولا قياسه مرجعياً ولا نشر أي تقييم لأدائه ولا إعادة بيعه ولا إتاحته لطرف ثالث، ولا السماح لغيره بشيء من ذلك.",
      "وتملك أبتال كل بيان تولّده اللوحة أو تشتقه من الاستخدام، ومنه إشارات المطابقة وسجلات النزاهة والقياسات والإحصاءات والبيانات المجمعة، ولها استخدامه دون قيد لتشغيل خدماتها وتأمينها وتحليلها وتحسينها وتدريب أنظمتها وإنتاج رؤى سوق العمل، بشرط ألا يُعرِّف ما تنشره منه بالعميل ولا بأي مرشح.",
      "ويمنح العميل أبتال ترخيصاً غير قابل للإلغاء وغير حصري وعالمياً ودون مقابل باستخدام ما يدخله على اللوحة من إعلانات وأوصاف وظيفية وملاحظات ومعايير، لتشغيل اللوحة وتحسينها.",
      "وكل ملاحظة أو اقتراح أو فكرة أو طلب ميزة يقدمه العميل أو أي من مستخدميه تؤول ملكيته إلى أبتال، ولها استخدامه ودمجه في منتجاتها دون قيد ولا إسناد ولا مقابل، ودون أي حق للعميل فيما ينشأ عنه."
    ]],
    ["استخدام اسم العميل وعلاماته", [
      "تُعرّف أبتال العميل بوصفه صاحب العمل الذي يقف خلف الإعلان لمن تعرضهم عليه من المرشحين، ولمن يتعامل مع الشاغر في تشغيل الخدمة. وهذا التعريف من طبيعة الخدمة ولا يخضع للترخيص الوارد أدناه.",
      "ويمنح العميل أبتال ترخيصاً غير حصري ودون مقابل باستخدام اسمه وشعاره وعلاماته التجارية للدلالة عليه بوصفه عميلاً لدى أبتال، في موقعها الإلكتروني وموادها التعريفية وعروضها ومراسلاتها ومخاطباتها للسوق. ويسري هذا الترخيص طوال مدة الاشتراك.",
      "وللعميل سحب هذا الترخيص في أي وقت بطلب كتابي إلى أبتال. وعند السحب توقف أبتال الاستخدام وتزيل اسم العميل وعلاماته من موقعها الإلكتروني ومما تسيطر عليه من مواد، وذلك مستقبلاً. ولا يلزم السحب أبتال باستعادة ما وُزّع فعلاً على أطراف ثالثة، ولا يمس التعريف الموضح في الفقرة الأولى، فيستمر بحكم الحق.",
      "وتظل علامات أبتال ملكاً لها. ولا يجوز للعميل استخدامها ولا الإشارة إلى أبتال في أي مادة تسويقية أو إعلامية أو في أي عرض دون موافقة كتابية مسبقة منها."
    ]],
    ["السرية", [
      "يلتزم كل طرف بالمحافظة على سرية المعلومات التي يتلقاها من الطرف الآخر ويدل ظرف الإفصاح عنها على سريتها، وبعدم الإفصاح عنها إلا لمن يحتاج الاطلاع عليها لتنفيذ هذه الاتفاقية وبالقدر اللازم.",
      "وتشمل معلومات أبتال السرية: أسعارها وعروضها وتقنيتها ونماذجها ومنهجيات قياسها ووثائقها غير المعلنة، وما تكشفه اللوحة من بيانات الكفاءات. وتشمل معلومات العميل السرية: إعلاناته غير المنشورة وسجلات مساره وقراراته الداخلية.",
      "ويلتزم العميل بعدم الإفصاح عن أي تقييم لأداء اللوحة ولا عن شروط تسعيرها، وبعدم مقارنتها علناً بأي منتج آخر.",
      "ويبقى التزام العميل بالسرية قائماً دون حد زمني ما دامت المعلومة محتفظة بطبيعتها السرية. ويبقى التزام أبتال 3 سنوات من تاريخ انتهاء الاتفاقية.",
      "ولا يمنع هذا البند أبتال من الإفصاح لمن تذكرهم سياسة الخصوصية من المستقبِلين، ولا يبيح الإفصاح لمستقبِل لم تذكره تلك السياسة. ولا يمنعها كذلك من الإفصاح الذي تلزمها به جهة مختصة، ولا من استخدام البيانات المشتقة والمجمعة وفق ما ورد في بند الملكية الفكرية."
    ]],
    ["حدود المسؤولية", [
      "إلى أقصى حد تجيزه الأنظمة، لا تُسأل أبتال عن أي خسارة غير مباشرة أو عرضية أو خاصة أو تبعية أو تأديبية، ولا عن فوات ربح أو إيراد أو فرصة أو عقد أو سمعة أو وفورات متوقعة، ولا عن تكلفة التعاقد البديل، ولا عن فقد بيانات أو تلفها، أياً كان سبب ذلك، وسواء عُلم باحتماله أو لم يُعلم.",
      "ولا تُسأل أبتال بأي حال عن:",
      {ul: [
        "أي قرار توظيف أو استبعاد يتخذه العميل، وعن نتائجه.",
        "سلوك أي مرشح أو أقواله أو مؤهلاته أو صحة معلوماته أو أدائه أو انسحابه أو عدم رده.",
        "أي علاقة عمل أو تعاقد يدخل فيه العميل مع مرشح، وأي نزاع ينشأ عنه.",
        "عدم بلوغ أي نتيجة توظيف، أو عدد المتقدمين، أو مدة الوصول إليهم.",
        "انقطاع اللوحة أو بطئها أو تعطل الربط مع أنظمة العميل أو مع أي طرف ثالث.",
        "وصول غير مصرح به ناشئ عن بيانات دخول العميل أو أجهزته أو شبكاته أو أفعال مستخدميه.",
        "أثر أي تعليق أو قيد أو ضم نطاق أو سحب تحقق تجريه أبتال وفق هذه الشروط."
      ]},
      "<strong>وإلى أقصى حد تجيزه الأنظمة، لا تتجاوز مسؤولية أبتال الإجمالية عن كل المطالبات الناشئة عن هذه الاتفاقية أو المتصلة بها، أياً كان سبب الدعوى، مجموع الرسوم التي سددها العميل فعلاً لأبتال خلال الأشهر الثلاثة السابقة مباشرةً للواقعة موضوع المطالبة، ولا تقل بحال عن 1,000 ريال.</strong>",
      "وإذا لم يسدد العميل أي رسم خلال تلك المدة، كانت مسؤولية أبتال في حدود 1,000 ريال.",
      "ولا تُقبل أي مطالبة تُرفع بعد مضي 6 أشهر من تاريخ الواقعة التي نشأت عنها، ويتنازل العميل عن حقه فيها بعد ذلك.",
      {note: "لا يستثني أي نص في هذه الاتفاقية ولا يحد من مسؤولية لا يجوز استثناؤها أو الحد منها بموجب أنظمة المملكة العربية السعودية."},
      "وتنطبق هذه الحدود على أبتال وعلى شركاتها التابعة ومنسوبيها ومقدمي خدماتها. ولا تنطبق على التزامات العميل في التعويض، ولا على مخالفته بند حظر الالتفاف، ولا على مخالفته بند التزاماته تجاه بيانات الكفاءات، ولا على أي مبلغ مستحق لأبتال."
    ]],
    ["تعويض أبتال", [
      "يلتزم العميل بتعويض أبتال وشركاتها التابعة ومنسوبيها ومقدمي خدماتها تعويضاً كاملاً، وبالدفاع عنهم عند طلبهم، وبإبراء ذمتهم من كل مطالبة أو دعوى أو تحقيق أو غرامة أو ضرر أو تكلفة أو أتعاب محاماة تنشأ عن أي مما يلي:",
      {ul: [
        "إعلاناته ومحتواه وما يقدمه من بيانات على اللوحة.",
        "قراراته في التوظيف والمفاضلة والاستبعاد، وعلاقاته العمالية والتعاقدية.",
        "استخدامه بيانات الكفاءات أو حفظه لها أو نقلها أو الاحتفاظ بها على خلاف هذه الشروط.",
        "تواصله مع المرشحين خارج اللوحة، ومخالفته بند حظر الالتفاف.",
        "مخالفته هذه الشروط أو سياسة الاستخدام المقبول أو أي نظام واجب التطبيق.",
        "أفعال مستخدميه أو أفعال من يصل إلى لوحة تحكمه ببيانات دخوله.",
        "أي مطالبة يرفعها شخص كُشفت بياناته للعميل عبر اللوحة بسبب تصرف العميل في تلك البيانات."
      ]},
      "ولأبتال تولي الدفاع في أي من ذلك على نفقة العميل. ولا يجوز للعميل التصالح على نحو يرتب على أبتال التزاماً أو إقراراً دون موافقتها الكتابية المسبقة.",
      "ولا يخضع هذا الالتزام لأي حد من حدود المسؤولية الواردة في هذه الشروط، ويبقى نافذاً بعد انتهاء الاتفاقية."
    ]],
    ["التعليق والإنهاء وآثارهما", [
      "لأبتال تعليق لوحة التحكم كلياً أو جزئياً، أو تقييد أي ميزة فيها، أو إنهاء هذه الاتفاقية، <strong>فوراً ودون إشعار ودون استرداد ووفق تقديرها المطلق</strong>، متى رأت قيام أي من الحالات التالية:",
      {ul: [
        "مخالفة هذه الشروط أو أي سياسة محال إليها فيها.",
        "عدم صحة بيانات التسجيل أو التحقق، أو تغيرها دون إفادة أبتال.",
        "تسجيل وكالة توظيف أو أي طرف يوظف نيابة عن غيره.",
        "انخفاض سجل النزاهة، أو ورود مؤشر على استخراج بيانات أو بناء قاعدة مرشحين.",
        "التأخر في سداد أي مبلغ مستحق.",
        "قيام خطر على المرشحين أو على أمن اللوحة أو على سمعة أبتال.",
        "طلب من جهة مختصة، أو تغير نظامي يجعل تقديم الخدمة غير ممكن."
      ]},
      "ولأبتال كذلك إنهاء هذه الاتفاقية لأي سبب أو دون سبب بإشعار مدته 30 يوماً. وعند هذا الإنهاء يُرد إلى العميل نسبياً ما لم يُستخدم من المدة المدفوعة سلفاً، محسوباً من تاريخ نفاذ الإنهاء.",
      "وللعميل إنهاء اشتراكه في أي وقت من لوحة التحكم. ويستمر الاشتراك إلى نهاية المدة المدفوعة، ولا يُرد عنها شيء.",
      "وعند الإنهاء: تُغلق الإعلانات المنشورة فوراً، ويتوقف استقبال الترشيحات، وينتهي وصول الفريق، ويُشعَر من كان مدعواً من المرشحين، وتُحذف بيانات لوحة التحكم وفق جدول الاحتفاظ المعلن، وتُستحق كل المبالغ القائمة فوراً وتُدرج في الفاتورة الأخيرة.",
      "ويظل تصدير بيانات لوحة التحكم متاحاً للعميل قبل الحذف. ولا يُشترط التحقق لهذا التصدير ولا لتحميل الفواتير.",
      "وتبقى نافذة بعد الإنهاء البنود التي تقتضي طبيعتها ذلك، ومنها: التزامات العميل تجاه بيانات الكفاءات، وحظر الالتفاف، والملكية الفكرية، والسرية، وحدود المسؤولية، والتعويض، والمبالغ المستحقة، والنظام الواجب التطبيق وتسوية المنازعات.",
      "ولا ينشأ للعميل بسبب التعليق أو الإنهاء أي حق في تعويض ولا في تمديد المدة فيما عدا ما تقرره سياسة الاسترداد في شأن التعليق ولا في نقل السعة إلى حساب آخر، ولا حق في استرداد إلا الرد النسبي عند إنهاء أبتال للاتفاقية دون سبب."
    ]],
    ["تعديل الشروط", [
      "لأبتال تعديل هذه الشروط وأي سياسة محال إليها فيها، في أي وقت ووفق تقديرها المطلق.",
      "وتُنشر النسخة المعدلة على اللوحة، وتُعد النسخة المنشورة فيها هي النسخة النافذة. ويسري التعديل في التاريخ الأحدث من تاريخ نشره وتاريخ أول دخول للعميل إلى لوحة التحكم بعده، وتُشعر أبتال العميل به في لوحة التحكم أو بالبريد الإلكتروني.",
      "<strong>ويُعد استمرار العميل في استخدام اللوحة بعد نفاذ التعديل قبولاً كاملاً للنسخة المعدلة.</strong> ومن لم يقبلها فسبيله الوحيد الامتناع عن الاستخدام وإنهاء اشتراكه وفق بند مدة الاشتراك والتجديد والإلغاء، وتستمر المدة المدفوعة سلفاً إلى نهايتها.",
      "ويسري تعديل الأسعار عند التجديد التالي وفق بند الرسوم، ويُعرض في لوحة التحكم قبل ذلك التجديد. ويسري ما عدا ذلك من التعديلات وفق ما سبق."
    ]],
    ["أحكام عامة", [
      "<strong>التنازل:</strong> لأبتال التنازل عن هذه الاتفاقية أو عن أي حق أو التزام فيها، كلياً أو جزئياً، إلى أي شركة تابعة أو خلف أو إلى من تؤول إليه أعمالها أو أصولها، دون موافقة العميل ودون إشعار. ولها إسناد أي جزء من تنفيذها إلى مقدمي خدمات من الباطن. ولا يجوز للعميل التنازل عن الاتفاقية ولا عن أي حق فيها دون موافقة كتابية مسبقة من أبتال، ولها منعها وفق تقديرها المطلق. ويُعد تغيير السيطرة على العميل تنازلاً يستوجب هذه الموافقة.",
      "<strong>القوة القاهرة:</strong> لا تُسأل أبتال عن أي تأخر أو إخلال سببه أمر خارج عن سيطرتها المعقولة، ومنه انقطاع الاتصالات أو الكهرباء أو الإنترنت، وتعطل مزودي الاستضافة أو الخدمات، والهجمات السيبرانية، والكوارث، والأوبئة، والإجراءات الحكومية. ولا ينشأ عن ذلك حق في استرداد ولا في تعويض.",
      "<strong>الإشعارات:</strong> تُعد الإشعارات الموجهة إلى العميل صحيحة متى أُرسلت إلى عناوين البريد المسجلة لمسؤولي الحساب أو نُشرت في لوحة التحكم، وتُعد مستلمة في اليوم نفسه. ولا تُقبل الإشعارات الموجهة إلى أبتال إلا كتابةً إلى help@uptal.com، وتُعد مستلمة عند تأكيد أبتال استلامها. ويمكن مراسلة أبتال على help@uptal.com، وتُقدَّم بياناتها النظامية بناءً على طلب كتابي.",
      "<strong>استقلال الطرفين:</strong> كل طرف متعاقد مستقل. ولا تنشأ عن هذه الاتفاقية شراكة ولا وكالة ولا مشروع مشترك ولا علاقة عمل بين أبتال والعميل ولا بين أبتال وأي مرشح.",
      "<strong>كامل الاتفاق:</strong> تمثل هذه الشروط والسياسات المحال إليها فيها كامل الاتفاق بين الطرفين، وتحل محل كل تفاهم أو عرض أو مراسلة أو وعد سابق. ولا يعتد العميل بأي بيان لم يرد فيها.",
      "<strong>عدم التنازل عن الحقوق:</strong> لا يُعد تأخر أبتال في استعمال أي حق ولا عدم استعمالها له تنازلاً عنه، ولا يمنع استعماله لاحقاً، ولا يمتد أي تنازل كتابي إلى غير الحالة التي صدر فيها.",
      "<strong>استقلال البنود:</strong> إذا تقرر عدم نفاذ أي بند، بقيت بقية البنود نافذة، وطُبّق ذلك البند إلى أقصى حد ممكن على نحو يحقق مقصده.",
      "<strong>أطراف الاتفاقية:</strong> لا يكتسب أي شخص من غير أبتال والعميل حقاً بموجب هذه الاتفاقية. ولا يمس ذلك الحقوق التي يملكها الأشخاص في بياناتهم الشخصية، فهي حقوق قائمة بذاتها لا ينشئها هذا العقد ولا يحد منها أي نص فيه."
    ]],
    ["إذا كان العميل جهة حكومية", [
      "إذا كان العميل جهة حكومية، سرت الأحكام التالية إضافةً إلى بقية هذه الشروط، وسمت عليها عند الاختلاف.",
      {ul: [
        "تسري على شواغره مهل بتّ أطول من المهل المقررة للمنشآت، وفق ما هو معلن في لوحة التحكم.",
        "واعتماد النشر بالفصل بين المُعِدّ والمعتمِد مفعّل تلقائياً، فلا يُنشر إعلان أعدّه مستخدم غير مخوّل بالاعتماد إلا باعتماد مسؤول الحساب أو مدير الاستقطاب. وللعميل تعطيله من لوحة التحكم، ويتحمل مسؤولية القرار في الحالين.",
        "ويتم الدفع بالتحويل البنكي أو بمقابل أمر شراء، بمرجع الدفع وبيانات الحساب الصادرة في لوحة التحكم عند الشراء. وتُفعَّل السعة عند تأكد استلام المبلغ.",
        "ولا يسري ترخيص استخدام اسم العميل وعلاماته في التسويق العام. ولا تذكر أبتال العميل علناً دون موافقة كتابية منفصلة منه، ويستمر التعريف به للمرشحين وفي تشغيل الخدمة وفق ما ورد في ذلك البند."
      ]},
      "ولا يغيّر هذا البند الأسعار ولا حدود الاستخدام ولا التزامات العميل تجاه بيانات الكفاءات ولا بند النظام الواجب التطبيق وتسوية المنازعات."
    ]],
    ["النظام الواجب التطبيق وتسوية المنازعات", [
      "تخضع هذه الاتفاقية وكل ما ينشأ عنها أو يتصل بها لأنظمة المملكة العربية السعودية.",
      "ويسعى الطرفان إلى تسوية أي نزاع ودياً خلال 30 يوماً من إشعار كتابي بموضوعه.",
      "فإن لم تتم التسوية، فُصل في النزاع نهائياً بالتحكيم في مدينة الرياض، باللغة العربية، أمام محكّم فرد، وفق قواعد المركز السعودي للتحكيم التجاري، ويكون الحكم نهائياً ملزماً للطرفين.",
      "ولأبتال وحدها أن تختار بدلاً من ذلك الاختصاص الحصري للمحاكم المختصة في مدينة الرياض، بإشعار كتابي إلى العميل يصدر قبل رفع أي دعوى. ومتى صدر ذلك الإشعار كان الاختيار نهائياً في النزاع الذي يشمله.",
      "ولأبتال في كل الأحوال أن تطلب من أي جهة قضائية مختصة إجراءً تحفظياً أو مستعجلاً لحماية حقوقها أو بياناتها أو ملكيتها الفكرية، دون أن يُعد ذلك تنازلاً عن هذا البند.",
      "والنص العربي لهذه المستندات هو المعتمد في التفسير وعند الاختلاف، والنص الإنجليزي مقدَّم للتيسير."
    ]]
  ]
};

DOCS.terms.en = {
  title: "Terms of Service",
  sub: "A binding agreement between Uptal Information Technology Company and the subscribing entity.",
  intro: "These terms form a binding agreement between Uptal Information Technology Company, a company registered in the Kingdom of Saudi Arabia and referred to below as Uptal, and the entity that registers a dashboard on Uptal Recruiter and is referred to below as the Customer. By completing registration, or by accessing or using the board, the Customer accepts these terms in full through its authorized signer, and they bind it from the date of registration. These terms are addressed to companies and government entities hiring for their own vacancies, not to individuals, and no consumer relationship arises under them.",
  s: [
    ["Definitions and scope of the agreement", [
      "The following terms carry the meanings set out against them, unless the context requires otherwise.",
      {ul: [
        "<strong>The board:</strong> the Uptal Recruiter service, with all of its interfaces, software, matching engine and features. It is a private board: postings are never listed publicly, never indexed and never visible to another employer.",
        "<strong>The dashboard:</strong> the workspace allocated to the Customer on the board.",
        "<strong>A candidate:</strong> any person whose profile is presented to the Customer through the board, whether they applied to the Customer's posting or appear in the wider Uptal network.",
        "<strong>A job slot:</strong> the capacity that carries one live posting at a time.",
        "<strong>A seat:</strong> access for one user from the Customer's team.",
        "<strong>Verification:</strong> Uptal's procedure for establishing the Customer's entity, its activity, its corporate domain and the standing of its authorized signer.",
        "<strong>A profile unlock:</strong> the disclosure of a candidate's name and contact details before an interview invitation, within the limits the board allows."
      ]},
      "This agreement comprises these Terms of Service, the Privacy Policy, the Data Processing Terms, the Acceptable Use policy, the Refund Policy, and every policy Uptal publishes on the board and refers to in these terms.",
      "Where a conflict arises between these documents on a matter that more than one of them addresses, the following order applies:",
      {ul: [
        "The Data Processing Terms, on Uptal's processing of personal data on the Customer's instruction and on the Customer's own obligations over that data.",
        "The Privacy Policy, on Uptal's processing of candidate, user and account personal data, and on the rights of the people that data belongs to.",
        "The Refund Policy, on refunds, on cancellation, and on the effect of a suspension or a termination on a paid period.",
        "The Acceptable Use policy, on what may and may not be done on the board.",
        "These Terms of Service, on every other matter, and on any matter none of the other documents addresses."
      ]},
      "These terms prevail over any purchase order, contracting form or general conditions issued by the Customer. No such condition has any effect, even if it is issued after this agreement is accepted, unless Uptal signs to the contrary in writing."
    ]],
    ["Eligibility and who may register", [
      "The board is for companies and government entities that hire for their own vacancies, and for them alone.",
      {warn: "<strong>Recruitment agencies, staffing and outsourcing firms, manpower offices, consultants who put people forward, and any party that hires or sources candidates on behalf of another, for a fee or without one, may not register.</strong> A registration made in breach of this is terminable immediately. Uptal may terminate the dashboard without notice and without refund, and keeps its right to claim the full loss it suffers."},
      "The Customer confirms that it hires for its own entity, or for an entity it wholly owns and discloses to Uptal, and that it will not use the board to supply candidates to a third party, to put candidates forward to one, or to build a pipeline on a third party's behalf.",
      "Uptal may refuse, suspend or terminate any registration at its sole discretion and without stating reasons.",
      {note: "Uptal establishes the standing of an entity at registration and afterwards, and may re-verify at any time. The fact that the service has continued for a period is no acceptance by Uptal of the Customer's standing."}
    ]],
    ["The account and the authorized signer", [
      "An account is opened with an official work email on the Customer's corporate domain. Personal email addresses and disposable addresses are not accepted.",
      "The authorized signer represents and warrants: that they hold the authority to bind the Customer to these terms, that every detail provided at registration or at verification is accurate, complete and current, that they hire for the Customer itself, and that every document uploaded is genuine and issued by its stated source.",
      "The Customer is responsible for every action taken under its dashboard, whether by its own team members or by anyone else using its credentials. Credentials are personal, and may not be shared or lent. The Customer must notify Uptal immediately of any suspected unauthorized access.",
      "The acts of any user on the dashboard are treated as the Customer's own acts, and the Customer may not rely on a user having exceeded its internal permissions.",
      {warn: "Providing an inaccurate detail at registration or at verification, or impersonating an entity or an authorized signer, is a material breach. Uptal may terminate immediately, without notice and without refund, in addition to any legal action it sees fit."}
    ]],
    ["Electronic contracting and records", [
      "Completing registration on the board is an electronic signature by the authorized signer, and it binds the Customer to this agreement in the same way as a signature on paper. The same applies to every acceptance, attestation, order and approval made on the board, and to the acceptance of any amendment to these terms.",
      "The Customer agrees that Uptal's electronic records of what was done on the board are the record of the parties' dealings. They include the audit log, the timestamps, the attestation signed at each publication in the name of the accountable owner, and the record of acceptance of these terms.",
      "Uptal may treat any instruction reaching it from the Customer's dashboard, or from the registered email address of one of the Customer's administrators, as issued by the Customer itself.",
      {note: "These records are evidence of what happened. They do not prevent the Customer from showing a manifest error in them."}
    ]],
    ["Verification and what it opens", [
      "The dashboard operates from registration, and no Uptal approval stands between registration and the first posting. An unverified dashboard runs with one job slot and one seat, and a second seat opens at no charge on verification.",
      "Verification is required for the following, and some of these items carry a further condition noted against them:",
      {ul: [
        "Reaching a candidate in the wider Uptal network who did not apply to the Customer's posting: unlocking their profile, inviting them to interview, or holding a sealed intro call with them.",
        "The second seat and every seat beyond it.",
        "Integrations, including the applicant tracking system connection and the application programming interface (API). These require a paid job slot or a paid seat as well as verification.",
        "Bulk actions on candidates, and the role status pack export. These require verification and nothing further.",
        "The hiring record audit pack export. This requires a paid job slot or a paid seat as well as verification."
      ]},
      "Nothing else is conditioned on verification. Browsing the wider Uptal network and reading sealed profiles remain open, the Customer's own applicants remain workable end to end, including the interview invitation, the sealed intro call and the recorded outcome, job slots remain purchasable from day one, and the export of dashboard data on leaving and the download of invoices remain available at all times.",
      "Uptal decides alone and at its sole discretion whether to grant, defer, suspend or withdraw verification after granting it, may decline it without stating reasons and without liability, may require further documents or re-verify at any time, and may suspend the dashboard pending re-verification.",
      {note: "Verification is an internal Uptal procedure. It is not an endorsement of the Customer's legal standing, not a recommendation of the Customer, and not a warranty about the Customer to any third party, and it creates no right against Uptal for anyone."},
      "The withdrawal or suspension of verification carries no refund, and the features that verification opened close as soon as it is withdrawn."
    ]],
    ["Domain claim and dashboard consolidation on verification", [
      "Verification confirms the Customer's corporate domain, and Uptal claims it for the verified dashboard. A claimed domain is never reassigned.",
      "<strong>The Customer consents in advance and expressly</strong> to the consolidation, on verification, of every other dashboard registered on that same confirmed domain into its verified dashboard, and to those dashboards ceasing to exist as separate accounts.",
      "<strong>The Customer also consents, at its own registration and for as long as its dashboard exists,</strong> that if another entity later verifies that same corporate domain, the Customer's own dashboard will be consolidated into that entity's verified dashboard on the same terms and will cease to exist as a separate account. Uptal notifies the users of a dashboard when it is consolidated. A Customer that does not want its records to pass in this way must not register on another entity's domain.",
      "Consolidation moves into the verified dashboard everything the consolidated dashboards held: postings and their candidate pipelines, initiatives, saved job descriptions, departments, seat requests, the integrity record, and paid job slots.",
      "The authorized signer who completed verification is the administrator of the consolidated dashboard. An administrator of a consolidated dashboard joins as a Recruiter, and any later change of permission is the administrator's to make alone. Seats needed by those who arrive through consolidation are granted at no charge and are never invoiced.",
      "Anyone signing in at the address of a consolidated dashboard arrives in the verified one. Where the domain was already claimed, a dashboard that verifies on it afterwards is consolidated into the holder of the claim, and the later verifier receives no separate account.",
      {warn: "Consolidation is final and cannot be reversed. Uptal bears no liability to the Customer for its effect on the Customer's internal arrangements or on the confidentiality of its information between its own departments. Organizing access inside the entity after consolidation is the administrator's responsibility alone."},
      {note: "Consolidation moves candidate personal data between dashboards registered on the same corporate domain. Its effect on personal data is described in the Privacy Policy."}
    ]],
    ["The service, and the absence of any promise of a result", [
      "Uptal matches candidates from its own network to the Customer's postings and presents pre-screened applicants inside the dashboard. The board is private: postings are never listed publicly, never indexed and never visible to another employer.",
      {warn: "<strong>Uptal does not promise or guarantee any hire, any offer, any interview, any number of applicants, any standard of their quality, any time to reach them, or any hiring outcome whatsoever.</strong> The service is an effort to present suitable candidates. Nothing in these terms, and nothing in any Uptal communication, presentation or marketing material, is a promise of a result or a basis for reliance."},
      "The board is provided <strong>as is</strong> and <strong>as available</strong>, without any warranty of any kind, express or implied, to the fullest extent permitted by law. Uptal does not warrant that the board will run without interruption, that it will be free of errors, that information provided by candidates is accurate, or that the board is fit for any particular purpose.",
      "The board carries no service level commitment. No service credits, compensation or discounts are given for any interruption, slowness, maintenance or outage, of any duration.",
      "Uptal may, alone and at its sole discretion, change the board or any feature of it, add features, change its limits and capacity, or withdraw it in whole or in part, at any time and without prior notice. Where a change reduces a paid feature, the Customer's sole and exclusive remedy is to stop renewing.",
      "Interviews, job offers, contracting and hiring take place outside the board and directly between the Customer and the candidate. Uptal is not a party to any employment relationship or to the negotiation of one, and bears no obligation arising from it.",
      "The Customer alone bears every obligation arising from its hiring, its decisions and its employment relationships, including those relating to advertising, selection, contracting and pay, with no recourse against Uptal."
    ]],
    ["Seats, permissions and credentials", [
      "Every dashboard includes one seat. A second seat opens at no charge on verification. Seats beyond the second may be purchased only after verification, at SAR 75 per seat per month, excluding value added tax.",
      "Team invitations are limited to email addresses on the Customer's registered corporate domain or on a sub domain of it. No person from outside the entity may be invited, no seat may be shared between two people, and no seat may be held in the name of anyone other than the person actually using it.",
      "Access rights follow the permission granted in the dashboard. Only the administrator may change the plan, the seats, the job slots or the payment methods.",
      "The Customer remains responsible for safeguarding its credentials and for every use made of them. Uptal bears no liability for unauthorized access arising from the Customer's negligence, from shared credentials, or from the Customer's own devices and networks."
    ]],
    ["Postings and job slots", [
      "Every dashboard includes one job slot from registration, without verification. A job slot carries one live posting at a time and may be reused without limit. Additional job slots may be purchased from day one, at SAR 375 per slot per month, excluding value added tax.",
      "Every posting must be for a real, budgeted vacancy the Customer is actually hiring for at the time of publication, must be accurate and not misleading in its title, duties, salary band and workplace, and must relate to the Customer's own entity.",
      {warn: "<strong>Publishing in order to collect profiles, to benchmark salaries, to test the job market, to build a pipeline for a future need, or for any purpose other than filling the advertised vacancy, is prohibited.</strong> A posting made in breach of this is a false attestation. Uptal may remove the posting and suspend or terminate the dashboard immediately, without notice and without refund, and take any legal action it sees fit."},
      "At every publication the Customer signs an attestation that the vacancy is genuine, and the attestation is written to the audit log in the name of the accountable owner. The Customer must decide on applicants within the windows published on the board, and must record the outcome of every vacancy.",
      "Uptal may remove, pause or alter the presentation of any posting at its sole discretion, without notice and without refund, where it considers that the posting breaches these terms or the Acceptable Use policy, or harms candidates or the board.",
      "Purchasing an additional job slot relieves the Customer of no obligation under these terms, and gives it no right to any particular number of applicants."
    ]],
    ["Usage limits", [
      "The board applies limits to how much of it may be used on a single vacancy and in a single period. They include the cap on the number of submissions released on one vacancy, the quota of interview invitations on one vacancy, the budget of profile unlocks in the wider Uptal network on one vacancy and the window in which that budget runs, the decision windows within which applicants must be decided on, and the duration and the number of attempts of a sealed intro call.",
      "The limits in force are published in the dashboard, at the place where the act they govern is performed. They form part of the service. The Customer has no right to any capacity beyond them, and buying a job slot or a seat does not raise them.",
      "Uptal may change any of these limits under the clause on the service, and a change applies from the time it is published in the dashboard.",
      {note: "These limits are controls against identity harvesting and pipeline building. They are not a priced feature, and Uptal charges nothing to raise one."}
    ]],
    ["The Customer's obligations regarding candidate data", [
      "A candidate's identity stays sealed while the Customer reviews. The full curriculum vitae opens, with the identity still sealed, when the Customer shortlists the candidate. The interview invitation is the act that reveals the name and the contact details, and a profile unlock in the wider Uptal network is the only reveal permitted before an invitation, within the limits the board allows.",
      "Uptal discloses a candidate's personal data for the purpose of the single vacancy it was presented for, and for no other. The Customer undertakes to Uptal as follows:",
      {ul: [
        "To use the data only to assess the candidate for that single vacancy, and not for any other vacancy, even inside the same entity.",
        "Not to copy, photograph, transcribe or store the data outside the dashboard, except as the board expressly allows and within the same vacancy.",
        "Not to transfer the data to any subsidiary, sister or parent company, nor to any adviser, contractor or third party, except with Uptal's prior written permission.",
        "Not to add the candidate to a database, an applicant tracking system, a contact list or any record outside the board beyond what that single vacancy requires.",
        "Not to contact the candidate outside the board before their details have been revealed through the board, and not to attempt to identify them by any means before that.",
        "Not to use the board to build a pipeline, to accumulate a candidate reserve, or for any marketing, research or statistical purpose.",
        "Not to scrape, systematically extract from, or access the board by automated means other than through the authorized application programming interface (API).",
        "To keep the data only within the retention period published on the board and to destroy it afterwards, and to carry out without delay any deletion request Uptal passes to it."
      ]},
      "The Customer must demonstrate to Uptal on request how it has used any candidate's data, where it is held and how long it will remain, must cooperate with any check Uptal carries out for that purpose, and must notify Uptal immediately of any unauthorized access to that data.",
      {warn: "<strong>A breach of this clause is a material breach.</strong> It entitles Uptal to suspend or terminate immediately, without notice and without refund, and obliges the Customer to indemnify Uptal in full for everything arising from it, including claims, penalties, the cost of notification and remediation, and legal fees, unrestricted by any limitation of liability in these terms."},
      {note: "Candidates are not parties to this agreement. Nothing in it affects the rights people hold in their own personal data, and nothing in it limits Uptal's obligations towards them as the party that determines the purposes and means of processing that data. The obligations in this clause are owed by the Customer to Uptal, and they are additional to what the Customer owes those people themselves."}
    ]],
    ["Hiring integrity and the measurement of conduct", [
      "Uptal measures conduct on the board continuously and keeps an integrity record for each dashboard, based on the acts taken on it and the acts left undone. The record produces a score and a band, and the score, the band and the entries that make them up are published to the Customer in the dashboard.",
      "What tells against the record includes: shortlisting candidates who are never contacted, leaving postings without decisions, letting decision windows lapse, failing to record the outcome of a vacancy, posting roles that are not genuinely being filled, and usage patterns that indicate data extraction or pipeline building.",
      "An entry opens automatically when a condition in the record holds past its threshold, and it clears itself as soon as that condition stops holding. The band that results gates intake alone: the publication of postings, and the release of submissions into the dashboard. Recording a verdict on a candidate, inviting a candidate to interview, unlocking a profile the Customer is entitled to unlock, and closing a vacancy continue to work in every band, because the Customer must be able to cure what the record is measuring. A move to either of the two lowest bands does not take effect until an authorized Uptal supervisor confirms it, and the dashboard holds at the level above until then.",
      "The Customer may ask Uptal in writing to review any entry or any measure, and Uptal considers the request. The entry and the measure stand while the review runs. Only Uptal clears an entry that has not cleared itself, and Uptal decides every integrity matter at its sole discretion. Termination is not a consequence of the record; it is dealt with under the clause on suspension and termination.",
      "No restriction or reduction of capacity on this ground carries any refund, compensation or extension of the subscription period."
    ]],
    ["Non circumvention", [
      "Every candidate who comes to the Customer's knowledge through the board was introduced to it by Uptal, whether they applied to its posting or appeared in the wider Uptal network, and whether their profile was unlocked or stayed sealed.",
      "<strong>For 12 months</strong> from the date the candidate was last presented to the Customer or their details were last revealed, whichever is later, the Customer may not engage that candidate or take the benefit of their services outside the board, in any capacity and under any arrangement, including:",
      {ul: [
        "Employment on a permanent, fixed term or probationary contract.",
        "Engagement as a freelancer, a consultant or a contractor, or through an establishment they own or work through.",
